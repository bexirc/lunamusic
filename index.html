<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Music">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link id="app-favicon" rel="icon" type="image/png" sizes="1024x1024" href="icon-light.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Music</title>
<meta name="color-scheme" content="light dark">
<style>
:root {
 --bg:#f5f5f7;
 --panel:#ffffff;
 --text:#191919;
 --muted:#6e6e73;
 --line:rgba(0,0,0,.08);
 --accent:#ff2d55;
 --accent-fill:#ff2d55;
 --hover:rgba(0,0,0,.055);
 --sidebar:rgba(255,255,255,.75);
 --player:rgba(255,255,255,.91);
 --shadow:0 8px 35px rgba(0,0,0,.07);
}
body.dark {
 --bg:#111113;
 --panel:#202023;
 --text:#f5f5f7;
 --muted:#99999f;
 --line:rgba(255,255,255,.09);
 --hover:rgba(255,255,255,.08);
 --sidebar:rgba(28,28,31,.88);
 --player:rgba(32,32,35,.94);
 --shadow:0 8px 35px rgba(0,0,0,.25);
 --accent:#ff375f;
}
*{box-sizing:border-box}
body{
 margin:0;
 background:var(--bg);
 color:var(--text);
 font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",
 "Helvetica Neue",Arial,sans-serif;
 overflow:hidden;
}
button,input{font:inherit}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:3px}
button{min-height:36px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
button{cursor:pointer;color:inherit}
.app{height:100dvh;display:flex;flex-direction:column}
.workspace{flex:1;min-height:0;display:flex;overflow:hidden}
.sidebar{
 width:245px;flex-shrink:0;padding:28px 16px 20px;
 background:var(--sidebar);border-right:1px solid var(--line);
 overflow-y:auto;-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);
}
.brand{font-size:25px;font-weight:800;letter-spacing:-1.3px;
 margin:0 12px 32px;display:flex;align-items:center;gap:9px}
.brand-icon{color:var(--accent);font-size:29px}
.nav-title{font-size:11px;color:var(--muted);font-weight:700;
 margin:24px 12px 9px;text-transform:none;letter-spacing:.7px}
.nav-item{
 border:0;background:transparent;width:100%;display:flex;
 align-items:center;gap:13px;text-align:left;padding:11px 13px;
 border-radius:9px;font-size:14px;color:var(--muted);
 transition:.2s;
}
.nav-item:hover{background:var(--hover);color:var(--text)}
.nav-item.active{color:var(--accent);font-weight:650;background:var(--hover)}
.nav-icon{width:20px;text-align:center;font-size:18px}
.sidebar-bottom{margin-top:35px}
.main{flex:1;min-width:0;overflow-y:auto;padding:25px 35px 120px}
.topbar{display:flex;align-items:center;justify-content:space-between;
 gap:15px;margin-bottom:35px}
.top-left{display:flex;gap:9px}
.round-btn{
 width:34px;height:34px;border:0;border-radius:50%;
 background:var(--panel);font-size:18px;box-shadow:0 2px 8px #00000008;
}
.search-wrap{position:relative;max-width:340px;width:100%}
.search{
 width:100%;height:37px;border:1px solid var(--line);
 border-radius:9px;background:var(--panel);padding:0 13px 0 36px;
 color:var(--text);outline:none;font-size:13px;
}
.search-wrap:before{content:none}
.search:focus{border-color:var(--accent)}
.top-actions{display:flex;align-items:center;gap:10px}
.profile{
 width:34px;height:34px;border-radius:50%;background:var(--accent-fill);
 color:white;display:grid;place-items:center;font-weight:700;
}
h1{font-size:31px;letter-spacing:-1px;margin:0 0 7px}
.subtitle{font-size:14px;color:var(--muted);margin-bottom:27px}
.section-head{display:flex;align-items:center;justify-content:space-between;
 margin:32px 0 16px}
.section-head h2{font-size:21px;letter-spacing:-.5px;margin:0}
.text-button{border:0;background:none;color:var(--accent);font-size:13px}
.hero{
 min-height:240px;border-radius:16px;padding:32px;
 display:flex;align-items:flex-end;position:relative;overflow:hidden;
 background:linear-gradient(120deg,#311b55,#9e315c 60%,#f08a83);
 color:white;box-shadow:var(--shadow);
}
.hero:after{
 content:"♫";position:absolute;right:10%;top:-65px;
 font-size:300px;font-weight:800;color:#ffffff18;transform:rotate(12deg);
}
.hero-content{position:relative;z-index:1}
.hero-label{font-size:12px;text-transform:uppercase;letter-spacing:2px;
 opacity:.8;font-weight:700}
.hero h2{font-size:39px;letter-spacing:-1.5px;margin:10px 0}
.hero p{font-size:14px;opacity:.85}
.primary-btn{
 border:0;border-radius:20px;background:white;color:#242424;
 padding:10px 20px;font-weight:650;font-size:13px;
}
.grid{
 display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));
 gap:22px 17px;
}
.card{min-width:0;cursor:pointer}
.cover{
 width:100%;aspect-ratio:1;border-radius:9px;overflow:hidden;
 background:linear-gradient(135deg,#e9a0b0,#573c81);
 display:grid;place-items:center;position:relative;
 box-shadow:0 5px 15px #00000012;
}
.cover img{width:100%;height:100%;object-fit:cover}
.cover-placeholder{font-size:55px;color:#ffffffbd;font-weight:800}
.card-title{font-size:14px;font-weight:650;margin-top:10px;
 overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-sub{font-size:12px;color:var(--muted);margin-top:4px;
 overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.song-list{display:flex;flex-direction:column}
.song{
 display:grid;grid-template-columns:38px minmax(0,1fr) 70px 34px 34px;
 gap:12px;align-items:center;padding:8px 10px;border-radius:8px;
 cursor:pointer;min-height:55px;
}
.song:hover{background:var(--hover)}
.song.active .song-name{color:var(--accent)}
.song-cover{width:38px;height:38px;border-radius:5px;overflow:hidden;
 background:linear-gradient(135deg,#a76caa,#eaa3a3);display:grid;
 place-items:center;color:white;font-size:17px}
.song-cover img{width:100%;height:100%;object-fit:cover}
.song-info{min-width:0}
.song-name{font-size:13px;font-weight:600;white-space:nowrap;
 overflow:hidden;text-overflow:ellipsis}
.song-artist{font-size:12px;color:var(--muted);margin-top:4px;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-duration{font-size:12px;color:var(--muted);text-align:right}
.song-more{border:0;background:transparent;color:var(--muted);font-size:19px;min-width:36px;min-height:36px;border-radius:50%}
.player{
 height:91px;min-height:91px;flex-shrink:0;display:grid;
 grid-template-columns:minmax(180px,1fr) minmax(220px,1.3fr) minmax(150px,1fr);
 align-items:center;padding:0 22px;gap:20px;
 background:var(--player);border-top:1px solid var(--line);
 -webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);z-index:5;
}
.now-playing{display:flex;align-items:center;gap:12px;min-width:0}
.now-cover{width:55px;height:55px;border-radius:6px;overflow:hidden;
 background:linear-gradient(135deg,#e58caa,#6952a6);display:grid;
 place-items:center;color:white;font-size:22px;flex-shrink:0}
.now-cover img{width:100%;height:100%;object-fit:cover}
.now-info{min-width:0}
.now-title{font-size:13px;font-weight:700;white-space:nowrap;
 overflow:hidden;text-overflow:ellipsis}
.now-artist{font-size:11px;color:var(--muted);margin-top:5px}
.icon-btn{border:0;background:transparent;color:var(--muted);font-size:19px}
.icon-btn:hover{color:var(--accent)}
.controls{display:flex;align-items:center;flex-direction:column;gap:7px}
.control-buttons{display:flex;align-items:center;gap:22px}
.play-btn{
 width:34px;height:34px;border:0;border-radius:50%;
 background:var(--text);color:var(--bg);font-size:16px;
}
.progress-row{width:100%;display:flex;align-items:center;gap:9px;
 font-size:11px;color:var(--muted)}
input[type=range]{accent-color:var(--accent);cursor:pointer}
.progress{width:100%;height:4px}
.player-right{display:flex;justify-content:flex-end;align-items:center;gap:14px}
.volume{width:90px}
.empty{
 padding:55px 20px;text-align:center;color:var(--muted);
 background:var(--panel);border-radius:12px;
}
.empty strong{display:block;color:var(--text);font-size:18px;margin-bottom:8px}
.import-btn{
 border:0;background:var(--accent-fill);color:white;padding:10px 17px;
 border-radius:20px;font-weight:650;font-size:13px;
}
.import-btn:hover{filter:brightness(.94)}
.upload-area{
 position:fixed;inset:18px;z-index:40;border:2px dashed var(--accent);
 border-radius:22px;padding:28px;text-align:center;background:color-mix(in srgb,var(--panel) 94%,transparent);
 display:flex;flex-direction:column;justify-content:center;align-items:center;
 box-shadow:var(--shadow);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);pointer-events:auto;
}
.upload-area strong{font-size:22px}
.upload-area p{font-size:14px;color:var(--muted)}
.upload-area.drag{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--panel))}
.detail-head{display:flex;align-items:flex-end;gap:25px;margin:15px 0 30px}
.detail-cover{width:190px;height:190px;border-radius:12px;overflow:hidden;
 background:linear-gradient(135deg,#e58caa,#6952a6);display:grid;
 place-items:center;color:white;font-size:65px;flex-shrink:0}
.detail-cover img{width:100%;height:100%;object-fit:cover}
.detail-meta{font-size:12px;text-transform:uppercase;color:var(--muted)}
.detail-head h1{margin:9px 0}
.detail-actions{display:flex;gap:10px;margin-top:17px}
.secondary-btn{border:1px solid var(--line);background:var(--panel);
 padding:9px 17px;border-radius:20px;font-size:13px}
.mobile-nav{display:none}
.toast{
 position:fixed;bottom:110px;left:50%;transform:translateX(-50%);
 padding:11px 18px;border-radius:22px;background:var(--text);
 color:var(--bg);font-size:13px;z-index:20;opacity:0;
 pointer-events:none;transition:.25s;
}
.toast.show{opacity:1}
.modal-backdrop{
 position:fixed;inset:0;background:#0008;z-index:30;
 display:none;align-items:center;justify-content:center;padding:20px;
}
.modal-backdrop.show{display:flex}
.modal{width:min(420px,100%);padding:24px;border-radius:16px;
 background:var(--panel);box-shadow:var(--shadow)}
.modal h2{font-size:19px;margin:0 0 18px}
.modal input{width:100%;padding:11px;border:1px solid var(--line);
 background:var(--bg);color:var(--text);border-radius:8px;margin-bottom:12px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px}
.queue-panel{
 position:fixed;right:0;top:0;bottom:91px;width:320px;z-index:10;
 background:var(--panel);border-left:1px solid var(--line);
 padding:22px;transform:translateX(105%);transition:.3s;
 overflow:auto;box-shadow:var(--shadow);
}
.queue-panel.show{transform:translateX(0)}
.queue-head{display:flex;justify-content:space-between;align-items:center}
.queue-head h2{font-size:20px}
.queue-track{display:flex;gap:10px;padding:10px 0;align-items:center;
 cursor:pointer;border-bottom:1px solid var(--line)}
.queue-track img{width:38px;height:38px;object-fit:cover;border-radius:5px}
.queue-track div{min-width:0}
.queue-track strong,.queue-track small{display:block;white-space:nowrap;
 overflow:hidden;text-overflow:ellipsis}
.queue-track strong{font-size:13px}
.queue-track small{font-size:11px;color:var(--muted);margin-top:4px}
.hidden{display:none!important}
@media(max-width:760px){
 .sidebar{display:none}
 .main{padding:calc(17px + env(safe-area-inset-top)) 17px calc(155px + env(safe-area-inset-bottom))}
 .topbar{margin-bottom:25px}
 .top-actions .profile{display:none}
 .player{
 height:75px;position:fixed;bottom:calc(65px + env(safe-area-inset-bottom));left:8px;right:8px;
 border:1px solid var(--line);border-radius:12px;
 grid-template-columns:minmax(0,1fr) auto;padding:7px 11px;gap:8px;
 }
 .now-cover{width:43px;height:43px}
 .controls{gap:0}
 .control-buttons{gap:12px}
 .control-buttons .skip{display:none}
 .progress-row{display:none}
 .player-right{display:none}
 .mobile-nav{
 display:flex;position:fixed;bottom:0;left:0;right:0;height:calc(65px + env(safe-area-inset-bottom));
 padding:0 0 env(safe-area-inset-bottom);
 background:var(--player);-webkit-backdrop-filter:blur(25px);backdrop-filter:blur(25px);
 border-top:1px solid var(--line);z-index:8;
 justify-content:space-around;align-items:center;
 }
 .mobile-nav button{border:0;background:none;color:var(--muted);
 display:flex;flex-direction:column;gap:4px;align-items:center;font-size:11px}
 .mobile-nav button span:first-child{font-size:20px}
 .mobile-nav button.active{color:var(--accent)}
 .queue-panel{top:env(safe-area-inset-top);bottom:calc(140px + env(safe-area-inset-bottom));width:min(320px,90vw)}
 .hero{min-height:195px;padding:23px}
 .hero h2{font-size:30px}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 13px}
 .detail-head{align-items:center;flex-direction:column;text-align:center}
 .detail-cover{width:175px;height:175px}
 .detail-actions{justify-content:center}
 .song{grid-template-columns:38px minmax(0,1fr) 40px 30px 30px;gap:8px}
}

/* Masaüstü üst çubuğu: arama alanı içerik merkezinde, gezinme okları gizli */
@media (min-width:761px){
 .topbar{position:relative;justify-content:flex-end;min-height:42px}
 .top-left{display:none!important}
 .top-actions{margin-left:auto;flex:1;justify-content:flex-end;position:static}
 .topbar .search-wrap{display:none}
 body[data-page="search"] .topbar .search-wrap{display:block;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,58%);max-width:560px;min-width:260px;margin:0}
 body[data-page="search"] .top-actions{gap:14px}
 .sidebar .nav-title{display:flex;align-items:center;gap:9px}
 .sidebar .nav-title .nav-icon{width:18px;height:18px;display:inline-grid;place-items:center;font-size:0}
 .sidebar .nav-title .nav-icon .ic{width:16px;height:16px}
}

/* Apple-inspired refinement: quieter surfaces, clearer states, comfortable controls */
:root{--radius-card:14px;--ease-apple:cubic-bezier(.2,.8,.2,1)}
html{scroll-behavior:smooth}
.nav-item{border-radius:11px;transition:background .18s var(--ease-apple),color .18s var(--ease-apple),transform .18s var(--ease-apple)}
.nav-item:active,.round-btn:active,.icon-btn:active,.play-btn:active,.import-btn:active{transform:scale(.96)}
.nav-item.active{background:color-mix(in srgb,var(--accent) 10%,var(--panel));color:var(--accent)}
.hero{border-radius:20px}
.cover{border-radius:12px;transition:transform .22s var(--ease-apple),box-shadow .22s var(--ease-apple)}
.card:hover .cover{transform:translateY(-2px);box-shadow:0 10px 24px #00000018}
.song{border-radius:11px;transition:background .16s ease}
.song-more:hover{background:var(--hover);color:var(--accent)}
.round-btn,.play-btn,.import-btn,.secondary-btn{transition:transform .16s ease,filter .16s ease,background .16s ease}
.secondary-btn{min-height:40px}
.search{height:40px;border-radius:12px}
.empty{border:1px solid var(--line);border-radius:16px}
.modal{border:1px solid var(--line);border-radius:20px}
.queue-panel{border-radius:18px 0 0 18px}

/* ===== Liquid Glass katmanı: yalnızca gezinme/kontrol yüzeyleri cam; içerik (kart, liste, hero) cam değil ===== */
:root{
 --glass:rgba(255,255,255,.55);--glass-strong:rgba(255,255,255,.76);
 --glass-edge:rgba(255,255,255,.7);
 --glass-shadow:0 12px 40px rgba(0,0,0,.12),0 2px 8px rgba(0,0,0,.06);
 --blur:blur(28px) saturate(180%);
 --r-panel:26px;--gap:12px;--sidebar-w:245px;--player-h:76px;
 --track:rgba(128,128,136,.3)
}
body.dark{
 --glass:rgba(58,58,66,.46);--glass-strong:rgba(36,36,42,.74);--glass-edge:rgba(255,255,255,.18);
 --glass-shadow:0 12px 40px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.3)
}
body{
 background:
  radial-gradient(55vmax 38vmax at 6% -4%,color-mix(in srgb,var(--accent) 15%,transparent),transparent 70%),
  radial-gradient(50vmax 40vmax at 104% 104%,color-mix(in srgb,#5e5ce6 13%,transparent),transparent 70%),
  var(--bg);
 background-attachment:fixed
}
h1{font-size:34px;font-weight:700;letter-spacing:-.8px}
.section-head h2{font-size:22px;font-weight:700;letter-spacing:-.4px}
.ic{display:block;width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic .f{fill:currentColor;stroke:none}
.sidebar,.player,.mobile-nav,.queue-panel,.modal,.upload-area,.round-btn,.search{-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.main,.sidebar,.queue-panel{scrollbar-width:thin}

/* kenar çubuğu: yüzen cam panel */
.workspace{padding-left:calc(var(--sidebar-w) + var(--gap)*2)}
.sidebar{
 position:fixed;left:var(--gap);top:var(--gap);bottom:calc(var(--player-h) + var(--gap)*2);
 width:var(--sidebar-w);z-index:6;padding:24px 12px 16px;border:0;border-radius:var(--r-panel);
 background:var(--glass);
 box-shadow:inset 0 1px 0 var(--glass-edge),inset 0 0 0 .5px var(--glass-edge),var(--glass-shadow)
}
.brand{font-size:22px;font-weight:700;letter-spacing:-.6px;margin:0 12px 24px}
.brand-icon{display:grid;color:var(--accent)}
.brand-icon .ic{width:26px;height:26px}
.brand-icon.note-art{width:26px;height:26px;flex:none;--na:100%;background:var(--accent)}
.nav-item{color:var(--text);font-weight:500;gap:12px;padding:10px 12px;min-height:40px}
.nav-item:hover{background:var(--hover);color:var(--text)}
.nav-item.active{color:var(--text);font-weight:600;background:color-mix(in srgb,var(--accent) 14%,transparent)}
.nav-icon{display:grid;place-items:center;width:22px;height:22px;color:var(--accent)}
.main{padding:24px 32px calc(var(--player-h) + 56px)}

/* üst çubuk */
.top-actions{flex:1;min-width:0;justify-content:flex-end}
.search-wrap{flex:1;min-width:0;max-width:340px}
.search-ico{z-index:1;position:absolute;left:14px;top:50%;transform:translateY(-50%);display:grid;color:var(--muted);pointer-events:none}
.search-ico .ic{width:18px;height:18px}
.search{
 height:40px;border:0;border-radius:999px;padding:0 14px 0 40px;background:var(--glass);
 box-shadow:inset 0 1px 0 var(--glass-edge),inset 0 0 0 .5px var(--glass-edge)
}
.search:focus{box-shadow:inset 0 0 0 1.5px var(--accent)}
.round-btn{
 display:grid;place-items:center;width:40px;height:40px;padding:0;color:var(--text);background:var(--glass);
 box-shadow:inset 0 1px 0 var(--glass-edge),inset 0 0 0 .5px var(--glass-edge),0 2px 10px rgba(0,0,0,.08);
 transition:transform .16s var(--ease-apple),background .16s ease,opacity .16s ease
}
.round-btn:hover{background:var(--glass-strong)}
.round-btn:disabled{opacity:.35;cursor:default;transform:none}
.profile{width:40px;height:40px}

/* içerik */
.hero{border-radius:24px;min-height:260px}
.hero:after{content:"";font-size:0;color:transparent;right:-60px;top:-90px;width:360px;height:360px;border-radius:50%;
 background:radial-gradient(circle at 32% 30%,rgba(255,255,255,.3),rgba(255,255,255,0) 66%);transform:none}
.hero h2{margin:8px 0 6px}
.hero p{margin:0 0 18px}
.primary-btn,.import-btn,.secondary-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 20px;border-radius:999px}
.primary-btn{transition:transform .16s ease,filter .16s ease}
.primary-btn:hover{filter:brightness(.96)}
.primary-btn:active{transform:scale(.96)}
.primary-btn .ic,.import-btn .ic,.secondary-btn .ic{width:16px;height:16px}
.cover-placeholder{display:grid;place-items:center;width:100%;height:100%;font-size:0;color:rgba(255,255,255,.88)}
.cover-placeholder .ic{width:38%;height:38%}
.song-cover,.now-cover,.detail-cover{display:grid;place-items:center;color:rgba(255,255,255,.9)}
.song-cover{border-radius:8px}
.song-cover .ic{width:52%;height:52%}
.now-cover .ic{width:46%;height:46%}
.detail-cover .ic{width:38%;height:38%}
.song{grid-template-columns:38px minmax(0,1fr) 64px 36px 36px;gap:12px}
.song:focus-visible{outline-offset:-2px}
.song-more{display:grid;place-items:center;padding:0;width:36px;height:36px;color:var(--muted);transition:background .16s ease,color .16s ease}
.song-more .ic{width:18px;height:18px}
.song-more.on{color:var(--accent)}
.detail-actions{margin-bottom:8px}
.setting-row{display:flex;justify-content:space-between;align-items:center;gap:16px;cursor:default}

.fp-times{display:flex;justify-content:space-between;font-size:.75rem;color:rgba(255,255,255,.6);font-variant-numeric:tabular-nums}
.fp-ctrl{display:flex;justify-content:center;align-items:center;gap:40px;margin:12px 0 8px}
.fp .fp-ctrl button{width:64px;height:64px}
.fp-ctrl .ic{width:36px;height:36px}
.fp-ctrl .fp-play .ic{width:56px;height:56px}
.fp-ctrl button:active{transform:scale(.88)}
.fp-vol{display:flex;align-items:center;gap:12px;margin:10px 0}

/* Masaüstü: kapak ve denetimler solda, sıradaki parçalar sağda */
@media(min-width:761px){
 .fp{border-radius:0}
 .fp-bg{inset:-100px;filter:blur(100px) saturate(1.55) brightness(.58)}
 .fp-wrap{width:min(1320px,calc(100% - 112px));max-width:none;margin:auto;display:grid;
  grid-template-columns:minmax(420px, min(54vw,660px)) minmax(280px,360px);
  grid-template-rows:52px minmax(0,1fr);align-content:center;align-items:stretch;
  justify-content:center;column-gap:clamp(48px,7vw,112px);row-gap:8px;
  padding:28px 0;box-sizing:border-box}
 .fp-grab{grid-column:1/-1;grid-row:1;justify-self:end;align-self:start;width:44px;height:44px;
  border-radius:50%;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 5px 18px rgba(0,0,0,.16);
  cursor:pointer;transition:background .2s,transform .25s var(--ios)}
 .fp-grab:hover{background:rgba(255,255,255,.23);transform:scale(1.06)}
 .fp-grab:active{transform:scale(.94)}
 .fp-grab span{display:none}
 .fp-grab::after{content:"×";font:400 30px/1 system-ui;color:#fff}
 .fp-main{grid-column:1;grid-row:2;min-width:0;min-height:0;display:flex;flex-direction:column;
  align-items:flex-start;justify-content:center;gap:clamp(8px,1.5vh,16px)}
 .fp-art-box{flex:none;width:100%;min-height:0;display:flex;justify-content:flex-start;align-items:center;padding:0}
 .fp-art{width:min(100%,min(38vh,440px));max-height:38vh;aspect-ratio:1;border-radius:18px;
  border:1px solid rgba(255,255,255,.32);

 .fp-meta{width:min(100%,440px);margin:0;gap:16px}
 .fp-title{font-size:clamp(1.35rem,1.8vw,1.9rem)}
 .fp-artist{font-size:1rem}
 .fp-prog{width:min(100%,440px);margin:0}
 .fp-ctrl{width:min(100%,440px);justify-content:flex-start;gap:clamp(22px,3vw,40px);margin:0}
 .fp-ctrl button{width:54px!important;height:54px!important}
 .fp-ctrl .fp-play{width:64px!important;height:64px!important}
 .fp-ctrl .fp-play .ic{width:48px;height:48px}
 .fp-vol{width:min(100%,360px);margin:0;justify-content:flex-start}
 .fp-bottom{width:min(100%,280px);justify-content:flex-start;gap:24px}
 .fp :is(.fp-ic,.fp-ctrl button,.fp-bottom button){cursor:pointer}
 .fp-queue{grid-column:2;grid-row:2;min-width:0;min-height:0;align-self:stretch;

  box-shadow:inset 0 1px 0 rgba(255,255,255,.12);-webkit-backdrop-filter:blur(22px) saturate(140%);backdrop-filter:blur(22px) saturate(140%)}

 .fp-queue-list .empty{color:rgba(255,255,255,.6)}

/* ===== Kapaksız görsel: düz dolgu + vurgu renkli büyük nota ===== */
:root{--ph:#e5e5ea}
body.dark{--ph:#2c2c2e}
.cover,.song-cover,.now-cover,.detail-cover,.fp-art{background:var(--ph)}
.cover-placeholder,.song-cover,.now-cover,.detail-cover,.fp-art{color:var(--accent-fill)}
.cover-placeholder .ic,.detail-cover .ic{width:76%;height:76%}
.now-cover .ic{width:92%;height:92%}
.song-cover .ic{width:100%;height:100%}
.fp-art .ic{width:60%;height:60%}
/* ===== iOS anahtar, tema seçici, müzik ekle, hero mozaik ===== */
:root{--thumb:#fff}
body.dark{--thumb:#636366}
.ios-switch{position:relative;display:inline-block;width:51px;height:31px;flex-shrink:0}
.ios-switch input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:2}
.ios-switch i{position:absolute;inset:0;border-radius:999px;background:color-mix(in srgb,CanvasText 16%,Canvas);transition:background-color .3s var(--ios)}
.ios-switch i::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:999px;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:transform .38s var(--ios),width .22s var(--ios)}
.ios-switch input:checked+i{background:var(--accent-fill)}
.ios-switch input:checked+i::after{transform:translateX(20px)}
.ios-switch input:active+i::after{width:33px}
.ios-switch input:checked:active+i::after{transform:translateX(14px)}
.ios-switch input:focus-visible+i{outline:3px solid var(--accent);outline-offset:2px}
.seg-row{padding:8px 12px!important}
.seg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);width:100%;padding:2px;border-radius:9px;background:var(--hover);isolation:isolate}
.seg button{position:relative;z-index:1;min-height:36px;border:0;background:none;border-radius:7px;font-size:.9375rem;font-weight:500;color:var(--text);padding:0}
.seg button[aria-checked=true]{font-weight:600}
.seg-thumb{position:absolute;z-index:0;top:2px;bottom:2px;left:2px;width:calc((100% - 4px)/3);border-radius:7px;background:var(--thumb);box-shadow:0 2px 6px rgba(0,0,0,.16);transform:translateX(calc(var(--i,0)*100%));transition:transform .4s var(--ios)}
.round-btn.add-music{background:var(--hover);color:var(--accent);width:44px;height:44px;border-radius:50%}
.add-music .ic{width:22px;height:22px;stroke-width:2.2}
body:not([data-page="home"]) #addMusicBtn{display:none}
.hero{background:#1c1c1e}
.hero:after{content:"";inset:0;right:0;top:0;font-size:0;transform:none;background:linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,.78))}
.hero-mosaic{position:absolute;inset:-35%;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;transform:rotate(-12deg)}
.hero-mosaic i{aspect-ratio:1;border-radius:6px;display:block}
.hero-mosaic i:nth-child(10n+1){background:linear-gradient(135deg,#f6d365,#fda085)}
.hero-mosaic i:nth-child(10n+2){background:radial-gradient(circle,#111 0 28%,#e63946 29% 60%,#111 61%)}
.hero-mosaic i:nth-child(10n+3){background:conic-gradient(from 90deg,#1d3557,#457b9d,#a8dadc,#1d3557)}
.hero-mosaic i:nth-child(10n+4){background:repeating-linear-gradient(45deg,#ffbe0b 0 10px,#fb5607 10px 20px)}
.hero-mosaic i:nth-child(10n+5){background:radial-gradient(circle at 70% 30%,#fff 0 8%,transparent 9%),linear-gradient(160deg,#0f0c29,#302b63,#24243e)}
.hero-mosaic i:nth-child(10n+6){background:linear-gradient(180deg,#00b4d8 50%,#03045e 50%)}
.hero-mosaic i:nth-child(10n+7){background:radial-gradient(circle at 30% 70%,#ff006e,transparent 55%),#3a0ca3}
.hero-mosaic i:nth-child(10n+8){background:conic-gradient(#ef476f 0 25%,#ffd166 0 50%,#06d6a0 0 75%,#118ab2 0)}
.hero-mosaic i:nth-child(10n+9){background:linear-gradient(135deg,#2b2d42 50%,#edf2f4 50%)}
.hero-mosaic i:nth-child(10n){background:repeating-radial-gradient(circle,#2a9d8f 0 8px,#264653 8px 16px)}

/* ===== Kapaksız şarkı simgesi (kullanıcı nota görseli) + sekme kayma efektleri ===== */
.note-art{display:block;width:var(--na,56%);aspect-ratio:1;background:currentColor;-webkit-mask:var(--note-mask) center/contain no-repeat;mask:var(--note-mask) center/contain no-repeat}
.cover-placeholder{--na:54%}
.detail-cover{--na:54%}
.now-cover{--na:62%}
.song-cover{--na:62%}
.fp-art{--na:46%}
@keyframes slideFwd{from{opacity:0;transform:translateX(44px)}to{opacity:1;transform:none}}
@keyframes slideBack{from{opacity:0;transform:translateX(-44px)}to{opacity:1;transform:none}}
#page.slide-fwd{animation:slideFwd .5s var(--ios)}
#page.slide-back{animation:slideBack .5s var(--ios)}
@media(max-width:760px){
 .main{overflow-x:hidden}
 .nav-pill{display:block!important}
 .mobile-nav button.active{background:transparent}
}
/* ===== Yükleme çubuğu, seçim kilidi, çapraz geçiş, Arşiv ===== */
.import-bar{display:none;flex-direction:column;justify-content:center;gap:7px;min-height:44px;margin:0 0 14px}
body.importing .import-bar{display:flex}
body.importing #page>h1{display:none}
.import-bar b{font-size:.8125rem;font-weight:600;color:var(--muted)}
.import-track{height:8px;border-radius:999px;background:var(--hover);overflow:hidden}
.import-fill{height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--accent-fill),color-mix(in srgb,var(--accent-fill) 55%,white),var(--accent-fill)) 0 0/200% 100%;transition:width .5s var(--ios);animation:shimmer 1.2s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}
.fp-q{font-size:.75rem;font-weight:600;letter-spacing:.2px;color:rgba(255,255,255,.75)}
.fp-title,.fp-artist{-webkit-touch-callout:none}
.cf-row{gap:14px}
.cf-row input[type=range]{flex:1;accent-color:var(--accent-fill)}
.cf-row output{min-width:44px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.cf-row.off{opacity:.4;pointer-events:none}
.lib-capsule{display:none}
.lib-fav{display:grid;justify-items:center;margin:6px 0 20px}
.lib-fav-tile{display:grid;gap:8px;justify-items:center;border:0;background:none;color:var(--text);font-size:.8125rem;font-weight:600;padding:0}
.lib-star{width:118px;height:118px;border-radius:12px;background:#ececf0;display:grid;place-items:center;color:var(--accent-fill);box-shadow:0 2px 10px rgba(0,0,0,.14)}
.lib-star .ic{width:54px;height:54px}
.lib-row{position:relative;width:100%;display:flex;align-items:center;gap:14px;min-height:50px;border:0;background:none;color:var(--text);padding:0;font-size:1.3rem}
.lib-row>.ic:first-child{width:24px;height:24px;color:var(--accent);flex-shrink:0}
.lib-row>span{flex:1;text-align:left}
.lib-row>.ic:last-child{width:14px;height:14px;color:var(--muted)}
.lib-row::after{content:"";position:absolute;left:38px;right:0;bottom:0;border-bottom:1px solid var(--line)}
.lib-h2{font-size:1.5rem;font-weight:800;margin:26px 0 12px}
@media(max-width:760px){
 html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
 input,textarea,[contenteditable="true"]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
 .main{padding-top:calc(28px + env(safe-area-inset-top))}
 body[data-page="home"] .topbar,body[data-page="library"] .topbar{position:absolute;top:calc(28px + env(safe-area-inset-top));right:max(20px,env(safe-area-inset-right));margin:0;z-index:2}
 body[data-page="library"] .top-actions .profile{display:grid!important}
 body[data-page="library"] .top-actions{gap:8px}
 body[data-page="library"] #page>h1{min-height:44px;display:flex;align-items:center;margin:0 0 14px;padding-right:160px}
 body[data-page="library"] .lib-capsule{display:flex;height:44px;border-radius:999px;background:var(--hover);padding:0 4px}
 .lib-capsule button{width:42px;height:44px;border:0;background:none;color:var(--text);display:grid;place-items:center;padding:0}
 .lib-capsule .ic{width:22px;height:22px}
 body[data-page="library"]:not(.sub) .topbar{display:flex}
 .queue-panel{transition:transform .5s var(--ios),visibility 0s linear .5s}
 .queue-panel.show{transition:transform .5s var(--ios),visibility 0s}
}
/* ===== Arşiv düzenleme, Göz At sanatçı dairesi, menü, liste görseli ===== */
[data-kind="artist"] .cover{border-radius:50%}
.artist-strip{display:flex;gap:16px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.artist-strip::-webkit-scrollbar{display:none}
.artist-strip .card{flex:none;width:92px;text-align:center}
.artist-strip .card-title{font-size:.8125rem;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artist-strip .card-sub{display:none}
.top-sub{font-size:.75rem;color:var(--muted);margin:-8px 0 10px}
.lib-tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:18px 16px;margin:6px 0 20px}
.lib-fav-tile{max-width:118px}
.lib-fav-tile>span:last-child{max-width:118px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lib-star img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
.lib-star{overflow:hidden}
.lib-star .note-art{--na:56%}
@keyframes wiggle{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
body.lib-edit .lib-fav-tile{animation:wiggle .28s ease-in-out infinite}
body.lib-edit .lib-fav-tile.picked{animation:none;transform:scale(1.08);transition:transform .35s var(--ios)}
body.lib-edit .lib-fav-tile.picked .lib-star{box-shadow:0 0 0 3px var(--accent-fill),0 10px 24px rgba(0,0,0,.25)}
.lib-hint{text-align:center;font-size:.8125rem;color:var(--muted);margin:-8px 0 14px}
.lib-row.edit{gap:12px;background:var(--bg)}
.lib-row.edit.dragging{z-index:5;box-shadow:0 6px 20px rgba(0,0,0,.2);border-radius:10px;transform:scale(1.02);transition:transform .25s var(--ios)}
.lib-check{display:grid!important;place-items:center!important;width:28px!important;height:28px!important;min-width:28px!important;min-height:28px!important;max-width:28px!important;max-height:28px!important;aspect-ratio:1/1;box-sizing:border-box!important;border-radius:50%!important;border:2px solid var(--muted);background:none;padding:0!important;margin:0;align-self:center;flex:0 0 28px!important;overflow:hidden;line-height:1;color:transparent;transition:background-color .25s ease,border-color .25s ease;appearance:none;-webkit-appearance:none}
.lib-check.on{background:var(--accent-fill);border-color:var(--accent-fill);color:#fff}
.lib-check .ic{width:14px;height:14px;stroke-width:3}
.lib-handle{width:44px;height:44px;display:grid;place-items:center;color:var(--muted);touch-action:none;flex:none!important}
.lib-handle .ic{width:22px;height:22px}
.lib-row.edit.off>span:nth-child(2){opacity:.45}
.lib-done{display:none}
.ios-menu{position:fixed;z-index:80;min-width:210px;padding:6px;border-radius:16px;background:var(--glass-strong);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);box-shadow:0 12px 40px rgba(0,0,0,.3),inset 0 0 0 .5px var(--line);transform-origin:top right;animation:menuIn .28s var(--ios)}
@keyframes menuIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.ios-menu button{width:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:44px;padding:0 14px;border:0;background:none;color:var(--text);font-size:1.0625rem;border-radius:10px}
.ios-menu button:active{background:var(--hover)}
.ios-menu .ic{width:20px;height:20px}
.pl-cover-pick{display:grid;place-items:center;margin:4px 0 14px}
.pl-cover{width:120px;height:120px;aspect-ratio:1;border-radius:14px;border:0;background:var(--ph);color:var(--accent);font-weight:600;overflow:hidden;padding:0;display:grid;place-items:center}
.pl-cover img{width:100%;height:100%;object-fit:cover}
@media(max-width:760px){
 .queue-panel{z-index:70}
 body.lib-edit .main{padding-bottom:40px}
 body.lib-edit .lib-capsule,body.lib-edit .top-actions .profile{display:none!important}
 body.lib-edit .lib-done{display:grid;place-items:center;color:var(--accent);font-weight:700;font-size:1.0625rem;height:44px;min-height:44px;min-width:68px;padding:0 18px;border:0;border-radius:999px;background:var(--hover);line-height:1;white-space:nowrap}
}
/* ===== Arşiv alt sayfaları, düzenleme geçişi, yuvarlak seçim, erişilebilirlik ===== */
*{-webkit-tap-highlight-color:transparent}
.sub-capsule{display:none}
.lib-row.edit.enter{animation:editIn .5s var(--ios) backwards;animation-delay:calc(var(--i,0)*45ms)}
.lib-hint{animation:fadeIn .4s ease-out}
@keyframes editIn{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.lib-check{position:relative}
.lib-check::after{content:"";position:absolute;inset:-9px}
.ios-menu button[aria-checked=true]{font-weight:600}
@media(prefers-reduced-motion:reduce){body.lib-edit .lib-fav-tile{animation:none}}
@media(max-width:760px){
 .mobile-nav,.player{transition:transform .5s var(--ios),opacity .35s ease}
 body.lib-edit .mobile-nav{transform:translateY(170%);opacity:0;pointer-events:none}
 body.lib-edit .player{transform:translateY(280%);opacity:0;pointer-events:none}
 .crumb{display:none}
 body.sub:is([data-page="songs"],[data-page="albums"],[data-page="artists"],[data-page="playlists"],[data-page="favorites"],[data-page="recent"],[data-page="playlistDetail"]) .sub-capsule{display:flex;margin-left:auto;height:44px;border-radius:999px;background:var(--hover);padding:0 4px}
 .sub-capsule button{width:42px;height:44px;border:0;background:none;color:var(--text);display:grid;place-items:center;padding:0}
 .sub-capsule .ic{width:22px;height:22px}
 .song{border-radius:14px;margin:0 -8px;padding:8px;transition:background-color .2s ease}
 .song::after{left:64px;right:8px}
 .song:active{background:var(--hover)}
 .song:focus:not(:focus-visible){outline:none}
 .card{border-radius:14px}
}
/* ===== Mobil alt bar ve mini oynatıcı ölçüleri ===== */
@media(max-width:760px){
 :root{--bar-x:30px;--tab-h:64px}
 .mobile-nav{left:max(var(--bar-x),env(safe-area-inset-left));right:max(var(--bar-x),env(safe-area-inset-right))}
 .mobile-nav button{font-size:.6875rem;gap:3px}

 .mobile-nav button>span:first-child{display:grid;place-items:center}
 .player{left:max(var(--bar-x),env(safe-area-inset-left));right:max(var(--bar-x),env(safe-area-inset-right));height:52px;min-height:52px}
 .now-cover{width:38px;height:38px}
 .player .play-btn .ic,.player #nextBtn .ic{width:26px;height:26px}

.lib-row>.lib-ico{flex:none;width:24px;height:24px;display:grid;place-items:center;color:var(--accent)}
.lib-ico .note-art{--na:78%}

/* ===== Tam ekran: logo konumu, yumuşak şarkı geçişi, dönen kapak gradyanı ===== */
@property --fp-c1{syntax:"<color>";inherits:true;initial-value:#5b3a7a}
@property --fp-c2{syntax:"<color>";inherits:true;initial-value:#c2466a}
@property --fp-c3{syntax:"<color>";inherits:true;initial-value:#2a2a3a}
.fp{--fp-c1:#5b3a7a;--fp-c2:#c2466a;--fp-c3:#2a2a3a;transition:transform .55s var(--ios),visibility 0s .55s,--fp-c1 1.4s ease,--fp-c2 1.4s ease,--fp-c3 1.4s ease}

.fp-bg{inset:0!important;background:#111!important;background-image:none!important;filter:none!important;transform:none!important;overflow:hidden}
.fp-bg::before,.fp-bg::after{content:"";position:absolute;inset:-60%;will-change:transform}
.fp-bg::before{background:conic-gradient(from 0deg at 50% 50%,var(--fp-c1),var(--fp-c2),var(--fp-c3),var(--fp-c1));filter:blur(80px) saturate(1.5) brightness(.72);animation:fpSpin 42s linear infinite}
.fp-bg::after{background:radial-gradient(circle at 28% 72%,var(--fp-c2),transparent 52%),radial-gradient(circle at 76% 26%,var(--fp-c3),transparent 50%);filter:blur(60px) brightness(.8);opacity:.75;animation:fpSpin 64s linear infinite reverse}
@keyframes fpSpin{to{transform:rotate(360deg)}}
.fp-art{position:relative}
.fp-txt{position:relative}
.fp-old{position:absolute;inset:0;display:grid;place-items:center;background:var(--ph);animation:fpOut .75s ease forwards;pointer-events:none}

.fp-art.fp-in>img,.fp-art.fp-in>.note-art{animation:fpImgIn .8s var(--ios) both}
.fp-old-txt{position:absolute;inset:0;pointer-events:none;animation:fpTxtOut .45s ease forwards}
.fp-txt.fp-in>.fp-title{animation:fpTxtIn .6s var(--ios) both}
.fp-txt.fp-in>.fp-artist{animation:fpTxtIn .6s var(--ios) .07s both}
@keyframes fpOut{to{opacity:0}}
@keyframes fpImgIn{from{opacity:0;transform:scale(1.1)}to{opacity:1;transform:none}}
@keyframes fpTxtIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

function openDB() {
 return new Promise((resolve,reject) => {
 const req = indexedDB.open(DB_NAME,1);
 req.onupgradeneeded = () => {
 const db = req.result;
 if (!db.objectStoreNames.contains(STORE))
 db.createObjectStore(STORE,{keyPath:"id"});
 };
 req.onsuccess = () => resolve(req.result);
 req.onerror = () => reject(req.error);
 });
}
async function dbAction(mode,action,data) {
 const db = await openDB();
 return new Promise((resolve,reject) => {
 const tx = db.transaction(STORE,mode);
 tx.oncomplete = () => db.close();
 const store = tx.objectStore(STORE);
 let req;
 if(action==="all") req=store.getAll();
 if(action==="put") req=store.put(data);
 if(action==="delete") req=store.delete(data);
 req.onsuccess=()=>resolve(req.result);
 req.onerror=()=>reject(req.error);
 });
}

}
function timeFormat(sec) {
 if(!Number.isFinite(sec)) return "0:00";

}

async function readMetadata(file) {
 const result={
 title:file.name.replace(/\.[^.]+$/,""),
 artist:"Bilinmeyen Sanatçı",
 album:"Bilinmeyen Albüm",
 cover:null,
 duration:0
 };
 if(!file.name.toLowerCase().endsWith(".mp3")) return result;
 try {
 const buffer=await file.slice(0,Math.min(file.size,8*1024*1024)).arrayBuffer();
 const v=new DataView(buffer);
 if(buffer.byteLength<10 || String.fromCharCode(...new Uint8Array(buffer,0,3))!=="ID3") return result;
 const version=v.getUint8(3);
 const size=(v.getUint8(6)<<21)|(v.getUint8(7)<<14)|(v.getUint8(8)<<7)|v.getUint8(9);
 let pos=10;
 const end=Math.min(10+size,buffer.byteLength);
 const decoder=new TextDecoder("utf-8");
 while(pos+10<end) {
 const id=String.fromCharCode(v.getUint8(pos),v.getUint8(pos+1),v.getUint8(pos+2),v.getUint8(pos+3));
 if(!id.trim() || id.charCodeAt(0)===0) break;
 let len=version===4
 ? ((v.getUint8(pos+4)<<21)|(v.getUint8(pos+5)<<14)|(v.getUint8(pos+6)<<7)|v.getUint8(pos+7))
 : v.getUint32(pos+4);
 if(len<=0 || pos+10+len>end) break;
 const start=pos+10;
 const frame=buffer.slice(start,start+len);
 if(["TIT2","TPE1","TALB"].includes(id)) {
 const bytes=new Uint8Array(frame);
 const enc=bytes[0];
 let value="";
 if(enc===0) value=new TextDecoder("iso-8859-1").decode(bytes.slice(1));
 else if(enc===1) value=new TextDecoder("utf-16").decode(bytes.slice(1));
 else if(enc===2) value=new TextDecoder("utf-16be").decode(bytes.slice(1));
 else value=decoder.decode(bytes.slice(1));
 value=value.replace(/\0/g,"").trim();
 if(id==="TIT2") result.title=value || result.title;
 if(id==="TPE1") result.artist=value || result.artist;
 if(id==="TALB") result.album=value || result.album;
 }
 if(id==="APIC" && !result.cover) {
 try {
 const bytes=new Uint8Array(frame);
 const enc=bytes[0];
 let p=1;
 while(p<bytes.length && bytes[p]!==0) p++;
 const mime=new TextDecoder().decode(bytes.slice(1,p)) || "image/jpeg";
 p+=2;
 if(enc===1 || enc===2) {
 while(p+1<bytes.length && !(bytes[p]===0 && bytes[p+1]===0)) p+=2;
 p+=2;
 } else {
 while(p<bytes.length && bytes[p]!==0) p++;
 p++;
 }
 const blob=new Blob([bytes.slice(p)],{type:mime});
 result.coverBlob=blob;
 } catch(e) {}
 }
 pos+=10+len;
 }
 } catch(e) {}
 return result;
}
async function importFiles(files) {
 const list=Array.from(files).filter(f=>
 f.type.startsWith("audio/") || /\.(mp3|m4a|wav|flac|ogg|aac)$/i.test(f.name)
 );
 if(!list.length) return notify("Desteklenen müzik dosyası bulunamadı.");
 let added=0,idx=0;
 impProgress(0,list.length,0);
 for(const file of list) {
 impProgress(idx++,list.length,.35);
 const duplicate=state.tracks.some(t=>
 t.name===file.name && t.size===file.size
 );
 if(duplicate) continue;
 const meta=await readMetadata(file);
 const track={
 id:uid(),name:file.name,size:file.size,
 title:meta.title,artist:meta.artist,album:meta.album,
 cover:meta.coverBlob?URL.createObjectURL(meta.coverBlob):null,coverBlob:meta.coverBlob,duration:0,favorite:false,
 added:Date.now(),type:file.type || "audio/mpeg",blob:file
 };
 try {
 await dbAction("readwrite","put",track);
 state.tracks.push(track);
 added++;
 } catch(e) {
 notify("Dosya kaydedilemedi. Depolama alanını kontrol et.");
 }
 }
 impDone();
 notify(added+" müzik eklendi.");
 render();
}
async function loadLibrary() {
 try {state.tracks=await dbAction("readonly","all");}
 catch(e){state.tracks=[];}
 state.tracks.forEach(t=>{t.cover=t.coverBlob?URL.createObjectURL(t.coverBlob):null;});
 render();
}
function snap() {return {page:state.page,detail:state.detail,scroll:$("main").scrollTop};}
function navigate(page,detail=null) {

 if(window.matchMedia("(max-width:760px)").matches&&TAB_ROOTS.includes(page)&&detail===null&&state.tab!==page){switchTab(page);return;}
 if(state.page!==page || JSON.stringify(state.detail)!==JSON.stringify(detail)) {
 state.previousPages.push(snap());
 state.nextPages=[];
 }
 state.page=page;
 state.detail=detail;
  $("main").scrollTop=0;
 render();
 if(page==="search" && window.matchMedia("(max-width:760px)").matches) setTimeout(()=>$("searchInput").focus(),60);
}
function goBack() {
 if(document.body.classList.contains("lib-edit")) return;
 if(!state.previousPages.length) return;
 window.__navDir="back";
 state.nextPages.push(snap());
 const e=state.previousPages.pop();
 state.page=e.page;state.detail=e.detail;
 render();$("main").scrollTop=e.scroll||0;
}
function goForward() {
 if(!state.nextPages.length) return;
 state.previousPages.push(snap());
 const e=state.nextPages.pop();
 state.page=e.page;state.detail=e.detail;
 render();$("main").scrollTop=e.scroll||0;
}

}

function getUniqueAlbumsOf(list) {
 const seen=new Set();

function getUniqueAlbums() {

async function buildTaggedMp3(t) {
 const file=t.blob;
 const head=new Uint8Array(await file.slice(0,10).arrayBuffer());
 let start=0;
 if(head.length>=10 && head[0]===0x49 && head[1]===0x44 && head[2]===0x33) {
 const size=(head[6]<<21)|(head[7]<<14)|(head[8]<<7)|head[9];
 start=10+size+((head[5]&0x10)?10:0);
 }
 const enc=new TextEncoder();
 const frame=(id,data)=>{
 const f=new Uint8Array(10+data.length);
 f.set(enc.encode(id),0);
 new DataView(f.buffer).setUint32(4,data.length);
 f.set(data,10);
 return f;
 };
 const text=(id,str)=>{
 const d=new Uint8Array(3+str.length*2+2);
 d[0]=1;d[1]=0xFF;d[2]=0xFE;
 for(let i=0;i<str.length;i++) {const c=str.charCodeAt(i);d[3+i*2]=c&255;d[4+i*2]=c>>8;}
 return frame(id,d);
 };
 const frames=[];
 if(t.title) frames.push(text("TIT2",t.title));
 if(t.artist && t.artist!==DEFAULT_ARTIST) {frames.push(text("TPE1",t.artist));frames.push(text("TPE2",t.artist));}
 if(t.album && t.album!==DEFAULT_ALBUM) frames.push(text("TALB",t.album));
 if(t.coverBlob) {
 const img=new Uint8Array(await t.coverBlob.arrayBuffer());
 const mime=enc.encode(t.coverBlob.type||"image/jpeg");
 const d=new Uint8Array(1+mime.length+1+1+1+img.length);
 d[0]=0;d.set(mime,1);
 d[1+mime.length]=0;d[2+mime.length]=3;d[3+mime.length]=0;
 d.set(img,4+mime.length);
 frames.push(frame("APIC",d));
 }
 const total=frames.reduce((n,f)=>n+f.length,0);
 const header=new Uint8Array([0x49,0x44,0x33,3,0,0,(total>>21)&127,(total>>14)&127,(total>>7)&127,total&127]);
 return new Blob([header,...frames,file.slice(start)],{type:"audio/mpeg"});
}

 name=(base.replace(/[\\/:*?"<>|]+/g," ").trim()||"sarki")+".mp3";

function playCollection(tracks,shuffle=false) {
 if(!tracks.length) return;
 state.queue=shuffle?[...tracks].sort(()=>Math.random()-.5):[...tracks];
 state.queueIndex=0;
 playTrack(state.queue[0],false);
}
function playTrack(track,resetQueue=true) {
 if(resetQueue) {
 state.queue=[...state.tracks];
 state.queueIndex=state.queue.findIndex(t=>t.id===track.id);
 } else {
 state.queueIndex=state.queue.findIndex(t=>t.id===track.id);
 }
 state.current=track;
 $("progress").value=0;paint($("progress"));
 if(audio.src) URL.revokeObjectURL(audio.src);
 audio.src=URL.createObjectURL(track.blob);
 audio.play().catch(()=>notify("Bu ses dosyası tarayıcıda oynatılamadı."));
 updatePlayer();
 renderQueue();
 render();
}
function updatePlayer() {
 const t=state.current;
 $("nowTitle").textContent=t?.title||"Bir şarkı seç";
 $("nowArtist").textContent=t?artistOf(t):"Müzik kitaplığın hazır";
 $("nowCover").innerHTML=t?.cover?`<img src="${t.cover}" alt="">`:noteArt();
 setIcon($("favoriteCurrent"),t?.favorite?"heartFill":"heart");
 $("favoriteCurrent").classList.toggle("on",!!t?.favorite);
 setIcon($("playBtn"),audio.paused?"play":"pause");
 $("playBtn").setAttribute("aria-label",audio.paused?"Oynat":"Duraklat");
 $("currentTime").textContent=timeFormat(audio.currentTime);
 $("totalTime").textContent=timeFormat(audio.duration || t?.duration);
 window.syncFull&&syncFull();
 if(typeof setFPQueueView==="function")setFPQueueView(fpQueueView);
}
function nextTrack() {
 if(!state.queue.length) return;
 if(state.repeat==="one") {audio.currentTime=0;audio.play();return;}
 if(state.shuffle) {
 state.queueIndex=Math.floor(Math.random()*state.queue.length);
 } else if(state.queueIndex<state.queue.length-1) {
 state.queueIndex++;
 } else if(state.repeat) {
 state.queueIndex=0;
 } else return;
 const t=state.queue[state.queueIndex];
 playTrack(t,false);
}
function previousTrack() {
 if(audio.currentTime>3){audio.currentTime=0;return;}
 if(state.queueIndex>0) state.queueIndex--;
 else return;
 playTrack(state.queue[state.queueIndex],false);
}

function renderQueue() {
 const queueHTML=state.queue.map((t,i)=>`
 <div class="queue-track ${i===state.queueIndex?"active":""}" data-queue="${i}" tabindex="0">
 ${t.cover?`<img src="${t.cover}" alt="">`:`<div class="song-cover">${noteArt()}</div>`}
 <div><strong>${escapeHTML(t.title)}</strong><small>${escapeHTML(artistOf(t))}</small></div>
 </div>`).join("") || emptyHTML("Kuyruk boş","Bir şarkı çal.");
 const fullQueueHTML=state.queue.map((t,i)=>`
 <div class="queue-track fp-queue-track ${i===state.queueIndex?"active":""}" data-queue="${i}" tabindex="0">
 ${t.cover?`<img src="${t.cover}" alt="">`:`<div class="song-cover">${noteArt()}</div>`}
 <div class="fp-queue-meta"><strong>${escapeHTML(t.title)}</strong><small>${escapeHTML(artistOf(t))}</small></div>
 <button class="fp-queue-more" type="button" data-fp-queue-menu="${i}" aria-label="${escapeHTML(t.title)} seçenekleri" title="Diğer seçenekler">${ic("more")}</button>
 </div>`).join("") || emptyHTML("Kuyruk boş","Bir şarkı çal.");
 $("queueList").innerHTML=queueHTML;
 if($("fpQueueList")) $("fpQueueList").innerHTML=fullQueueHTML;
 if($("fpQueueCount")) $("fpQueueCount").textContent=state.queue.length+" şarkı";
 setFPQueueView(fpQueueView);
 let dragFrom=null;
 document.querySelectorAll("[data-fp-queue-menu]").forEach(btn=>{
  btn.addEventListener("click",e=>{e.preventDefault();e.stopPropagation();openFPQueueMenu(Number(btn.dataset.fpQueueMenu),btn);});
 });
 document.querySelectorAll("[data-queue]").forEach(el=>{
  el.draggable=true;
  el.addEventListener("click",()=>{
   if(el.dataset.dragged==="1"){delete el.dataset.dragged;return;}
   state.queueIndex=Number(el.dataset.queue);
   playTrack(state.queue[state.queueIndex],false);
  });
  el.addEventListener("dragstart",e=>{
   dragFrom=Number(el.dataset.queue);el.classList.add("dragging");
   e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain",String(dragFrom));
  });
  el.addEventListener("dragover",e=>{e.preventDefault();e.dataTransfer.dropEffect="move";el.classList.add("drag-over");});
  el.addEventListener("dragleave",()=>el.classList.remove("drag-over"));
  el.addEventListener("dragend",()=>{el.classList.remove("dragging");document.querySelectorAll(".drag-over").forEach(x=>x.classList.remove("drag-over"));});
  el.addEventListener("drop",e=>{
   e.preventDefault();const from=dragFrom,to=Number(el.dataset.queue);
   if(from===null||from===to)return;
   const playing=state.queue[state.queueIndex];
   const [moved]=state.queue.splice(from,1);state.queue.splice(to,0,moved);
   state.queueIndex=state.queue.indexOf(playing);
   el.dataset.dragged="1";dragFrom=null;renderQueue();
  });
 });

}

function openFPQueueMenu(index,button){
 closeFPQueueMenu();
 const track=state.queue[index];if(!track)return;
 const isFav=!!track.favorite;
 const menu=document.createElement("div");
 menu.className="fp-queue-menu";
 menu.setAttribute("role","menu");
 menu.setAttribute("aria-label","Şarkı seçenekleri");
 menu.innerHTML=`
  <button role="menuitem" data-fpq-action="remove"><span>${ic("trash")}</span>Sıradan Kaldır</button>
  <div class="fpq-separator"></div>
  <button role="menuitem" data-fpq-action="album"><span>${ic("album")}</span>Albümde Gör</button>
  <button role="menuitem" data-fpq-action="artist"><span>${ic("person")}</span>Sanatçıya Git</button>
  <button role="menuitem" data-fpq-action="favorite"><span>${ic(isFav?"heartFill":"heart")}</span>${isFav?"Favorilerden Çıkar":"Favorilere Ekle"}</button>
  <div class="fpq-separator"></div>
  <div class="fpq-sub-wrap"><button class="fpq-sub-trigger" role="menuitem" data-fpq-action="playlist"><span>${ic("plus")}</span>Listeye Ekle<span class="fpq-chevron">›</span></button>
   <div class="fpq-submenu">${state.playlists.length?state.playlists.map(pl=>`<button role="menuitem" data-fpq-playlist="${pl.id}"><span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h11"/></svg></span>${escapeHTML(pl.name)}</button>`).join(""):`<div class="fpq-empty">Henüz çalma listesi yok</div>`}
   </div>
  </div>`;
 document.body.appendChild(menu);fpQueueMenu=menu;
 if(button?.id==="fpMobileMore")button.setAttribute("aria-expanded","true");
 const r=button.getBoundingClientRect(),mw=menu.offsetWidth,mh=menu.offsetHeight;
 const vv=window.visualViewport;
 const viewTop=vv?vv.offsetTop:0,viewHeight=vv?vv.height:window.innerHeight;
 const left=Math.max(12,Math.min(window.innerWidth-mw-12,r.right-mw));
 const preferredTop=r.bottom-mh-8;
 const top=Math.max(viewTop+12,Math.min(viewTop+viewHeight-mh-12,preferredTop));
 menu.style.left=left+"px";menu.style.top=top+"px";
 menu.addEventListener("pointerdown",e=>e.stopPropagation());
 menu.addEventListener("click",async e=>{
  e.stopPropagation();
  const action=e.target.closest("[data-fpq-action]")?.dataset.fpqAction;
  const playlistId=e.target.closest("[data-fpq-playlist]")?.dataset.fpqPlaylist;
  if(playlistId){
   const pl=state.playlists.find(x=>x.id===playlistId);
   if(pl&&!pl.tracks.includes(track.id)){pl.tracks.push(track.id);savePlaylists();notify("Şarkı listeye eklendi.");}
   else if(pl)notify("Bu şarkı zaten listede.");
   closeFPQueueMenu();return;
  }
  if(!action)return;
  if(action==="playlist"){menu.classList.toggle("show-sub");return;}
  if(action==="remove"){
   const wasCurrent=index===state.queueIndex;
   state.queue.splice(index,1);
   if(index<state.queueIndex)state.queueIndex--;
   else if(wasCurrent){
    if(state.queue.length){state.queueIndex=Math.min(index,state.queue.length-1);playTrack(state.queue[state.queueIndex],false);}
    else{state.queueIndex=-1;state.current=null;audio.pause();audio.removeAttribute("src");updatePlayer();}
   }
   renderQueue();notify("Şarkı sıradan kaldırıldı.");
  }else if(action==="album"){
   window.closeFullPlayer?.();
   navigate("detail",{type:"album",value:albumOf(track)});
  }else if(action==="artist"){
   window.closeFullPlayer?.();
   navigate("detail",{type:"artist",value:artistOf(track)});
  }else if(action==="favorite"){
   track.favorite=!track.favorite;
   await dbAction("readwrite","put",track);
   updatePlayer();render();
   notify(track.favorite?"Favorilere eklendi.":"Favorilerden çıkarıldı.");
  }
  closeFPQueueMenu();
 });
}

const darkMQ=matchMedia("(prefers-color-scheme: dark)");
function resolveDark() {return themePref==="dark"||(themePref==="system"&&darkMQ.matches);}
function setThemePref(p) {
 themePref=p;
 try {localStorage.setItem("music-theme",p);} catch(e) {}
 applyTheme(resolveDark());syncThemeSeg();
}
function syncThemeSeg() {
 const seg=$("themeSeg");if(!seg) return;
 const buttons=[...seg.querySelectorAll("button")];
 buttons.forEach(b=>b.setAttribute("aria-checked",String(b.dataset.theme===themePref)));
 const active=buttons.find(b=>b.dataset.theme===themePref),thumb=seg.querySelector(".seg-thumb");
 if(active&&thumb){
  const inset=Math.min(4,active.offsetWidth*.04);
  seg.style.setProperty("--theme-thumb-x",(active.offsetLeft+inset)+"px");
  seg.style.setProperty("--theme-thumb-w",Math.max(0,active.offsetWidth-inset*2)+"px");
 }
}
darkMQ.addEventListener("change",()=>{if(themePref==="system") applyTheme(resolveDark());});
window.addEventListener("resize",()=>requestAnimationFrame(syncThemeSeg),{passive:true});
if("ResizeObserver" in window){
 const themeSegObserver=new ResizeObserver(()=>requestAnimationFrame(syncThemeSeg));
 const observeThemeSeg=()=>{const seg=$("themeSeg");if(seg)themeSegObserver.observe(seg);};
 document.addEventListener("DOMContentLoaded",observeThemeSeg,{once:true});
}

function sampleCoverColor(src,done) {
 if(!src){done(document.body.classList.contains("dark")?"#111113":"#f5f5f7");return;}
 const im=new Image();
 im.onload=()=>{
  try{
   const c=document.createElement("canvas");c.width=c.height=12;
   const x=c.getContext("2d",{willReadFrequently:true});x.drawImage(im,0,0,12,12);
   const d=x.getImageData(0,0,12,12).data;let r=0,g=0,b=0,n=0;
   for(let i=0;i<d.length;i+=4){if(d[i+3]<100)continue;r+=d[i];g+=d[i+1];b+=d[i+2];n++;}
   if(!n)throw Error("empty image");
   // Slightly soften the sampled color so status chrome stays readable.
   r=Math.round(r/n*.78+28);g=Math.round(g/n*.78+28);b=Math.round(b/n*.78+28);
   done("#"+[r,g,b].map(v=>Math.max(0,Math.min(255,v)).toString(16).padStart(2,"0")).join(""));
  }catch(e){done(document.body.classList.contains("dark")?"#111113":"#f5f5f7");}
 };
 im.onerror=()=>done(document.body.classList.contains("dark")?"#111113":"#f5f5f7");
 im.src=src;
}

  if(tg){const c=libCfg(),k=tg.dataset.toggle,i=c.hidden.indexOf(k);i>=0?c.hidden.splice(i,1):c.hidden.push(k);libSave(c);
   tg.classList.toggle("on",i>=0);tg.closest(".lib-row").classList.toggle("off",i<0);return;}
  const t=e.target.closest("[data-tile]");
  if(t&&window.__libEdit){
   const id=t.dataset.tile;
   if(!picked){picked=id;t.classList.add("picked");return;}
   if(picked===id){picked=null;t.classList.remove("picked");return;}
   const c=libCfg(),o=libTileIds(c);o.splice(o.indexOf(picked),1);o.splice(o.indexOf(id)+(0),0,picked);c.tiles=o;libSave(c);picked=null;render();
  }
 });
 pg.addEventListener("click",e=>{if(window.__libEdit&&e.target.closest("[data-lib]")&&!e.target.closest("[data-tile]"))e.stopImmediatePropagation();},true);
 pg.addEventListener("pointerdown",e=>{
  const h=e.target.closest(".lib-handle");if(!h)return;e.preventDefault();
  const row=h.closest(".lib-row"),list=row.parentNode;row.classList.add("dragging");h.setPointerCapture(e.pointerId);
  const move=ev=>{for(const r of [...list.children]){if(r===row)continue;const b=r.getBoundingClientRect();
   if(ev.clientY>b.top&&ev.clientY<b.bottom){list.insertBefore(row,ev.clientY<b.top+b.height/2?r:r.nextSibling);break;}}};
  const up=()=>{h.removeEventListener("pointermove",move);h.removeEventListener("pointerup",up);h.removeEventListener("pointercancel",up);
   row.classList.remove("dragging");const c=libCfg();c.rows=[...list.children].map(r=>r.dataset.key);libSave(c);};
  h.addEventListener("pointermove",move);h.addEventListener("pointerup",up);h.addEventListener("pointercancel",up);
 });
 /* oynatma sayacı + 3 günde bir güncellenen ilk 10 */
 const PK="music-plays",TK="music-top10",ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d;}catch(e){return d;}};
 let counted=null;
 audio.addEventListener("timeupdate",()=>{
  const t=state.current;if(!t)return;
  if(audio.currentTime<2)counted=null;
  if(audio.currentTime<20||counted===t.id)return;
  counted=t.id;const p=ld(PK,{});p[t.id]=(p[t.id]||0)+1;try{localStorage.setItem(PK,JSON.stringify(p));}catch(e){}
 });

  const pl=ld(PK,{});
  if(!window.__topIds||(!window.__topIds.length&&Object.keys(pl).length))
   window.__topIds=Object.entries(pl).sort((a,b)=>b[1]-a[1]).slice(0,10).map(e=>e[0]);
  return window.__topIds.map(id=>state.tracks.find(t=>t.id===id)).filter(Boolean);
 };
 /* çalma listesi görseli (kare kırpma) */
 const squareCrop=file=>new Promise((res,rej)=>{
  const url=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const m=Math.min(im.width,im.height),c=document.createElement("canvas");c.width=c.height=512;
   c.getContext("2d").drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,512,512);URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",.85));};
  im.onerror=rej;im.src=url;
 });
 $("plCover").addEventListener("click",()=>$("plCoverFile").click());
 $("plCoverFile").addEventListener("change",async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;

})();

/* ===== Arşiv alt sayfaları: filtre / sıralama ===== */
window.__lf="all";window.__ls=null;
const trc=(x,y)=>String(x).localeCompare(String(y),"tr");
function libView(list) {
 let a=[...list];if(window.__lf==="fav")a=a.filter(t=>t.favorite);
 const k=window.__ls;
 if(k==="name")a.sort((x,y)=>trc(x.title,y.title));
 else if(k==="artist")a.sort((x,y)=>trc(artistOf(x),artistOf(y)));
 else if(k==="added")a.sort((x,y)=>y.added-x.added);

}
function libItems(list,kind) {
 const a=libView(list);
 if(window.__ls==="name")a.sort((x,y)=>trc(kind==="artist"?artistOf(x):albumOf(x),kind==="artist"?artistOf(y):albumOf(y)));
 return a;
}
function libPlaylists() {
 const a=[...state.playlists];if(window.__ls==="name"||window.__ls==="artist")a.sort((x,y)=>trc(x.name,y.name));
 return a;
}
function iosMenu(anchor,items) {
 document.getElementById("libMenu")?.remove();
 const r=anchor.getBoundingClientRect(),m=document.createElement("div");
 m.className="ios-menu";m.id="libMenu";m.setAttribute("role","menu");
 m.style.top=(r.bottom+8)+"px";m.style.right=Math.max(12,innerWidth-r.right)+"px";

  const b=document.createElement("button");b.setAttribute("role","menuitemradio");b.setAttribute("aria-checked",String(!!it.checked));

(function(){
 const cap=document.createElement("div");cap.className="sub-capsule";cap.id="subCapsule";
 cap.innerHTML=`<button id="subFilter" aria-label="Filtrele">${ic("menu")}</button><button id="subSort" aria-label="Sırala">${ic("more")}</button>`;

 $("subFilter").addEventListener("click",e=>{

   {label:"Tüm Parçalar",checked:window.__lf==="all",run:()=>{window.__lf="all";render();}},

 });
 $("subSort").addEventListener("click",e=>{
  e.stopPropagation();const page=state.page;let items=[
   {label:"Ad",checked:window.__ls==="name",run:()=>{window.__ls="name";render();}},
   {label:"Ekleme Tarihi",checked:window.__ls==="added",run:()=>{window.__ls="added";render();}},

  ];
  if(page==="playlists"||page==="albums"||page==="artists")items=[{label:"Ada Göre",checked:window.__ls==="name",run:()=>{window.__ls="name";render();}},{label:"Varsayılan Sıra",checked:!window.__ls,run:()=>{window.__ls=null;render();}}];
  iosMenu($("subSort"),items);
 });
 document.addEventListener("keydown",e=>{if(e.key==="Escape")document.getElementById("libMenu")?.remove();});
})();
/* ===== Sekme başına gezinme belleği ===== */
state.tab=state.tab||"home";
function switchTab(t) {
 if(document.body.classList.contains("lib-edit")) return;
 const cur=state.tab,main=$("main");
 if(t===cur) {
  if(state.page!==t||state.detail) {
   state.previousPages=[];state.nextPages=[];state.page=t;state.detail=null;
   window.__navDir="back";render();main.scrollTop=0;
  } else main.scrollTo({top:0,behavior:"smooth"});
  return;
 }
 tabMem[cur]={page:state.page,detail:state.detail,scroll:main.scrollTop,prev:state.previousPages,next:state.nextPages};
 const m=tabMem[t]||{page:t,detail:null,scroll:0,prev:[],next:[]};
 state.tab=t;state.page=m.page;state.detail=m.detail;state.previousPages=m.prev;state.nextPages=m.next;
 window.__tabSwitch=true;render();main.scrollTop=m.scroll||0;
 if(t==="search"&&state.page==="search") setTimeout(()=>$("searchInput").focus(),60);
}
document.querySelector(".mobile-nav").addEventListener("click",e=>{
 const b=e.target.closest("button[data-page]");if(!b) return;
 e.stopImmediatePropagation();e.preventDefault();switchTab(b.dataset.page);
},true);
var BACK_NAMES={home:"Ana Sayfa",browse:"Göz At",library:"Arşiv",search:"Arayın",songs:"Parçalar",albums:"Albümler",artists:"Sanatçılar",playlists:"Listeler",favorites:"Favori Parçalar",recent:"Son Eklenenler",settings:"Hesap",profile:"Profil",manage:"Şarkıları Yönet"};
function syncBackLabel() {
 const pv=state.previousPages[state.previousPages.length-1];

/* ===== Sayfalar: aşağı kaydırarak kapat (HIG Sheets) ===== */
(function(){
 const mq=matchMedia("(max-width:760px)");
 function drag(el,close){
  let y0=null,dy=0;
  el.addEventListener("touchstart",e=>{
   if(!mq.matches)return;const y=e.touches[0].clientY;
   if(y-el.getBoundingClientRect().top>72||e.target.closest("input,textarea,select,button")){y0=null;return;}
   y0=y;dy=0;},{passive:true});
  el.addEventListener("touchmove",e=>{if(y0===null)return;dy=Math.max(0,e.touches[0].clientY-y0);el.style.transition="none";el.style.transform=`translateY(${dy}px)`;},{passive:true});
  el.addEventListener("touchend",()=>{if(y0===null)return;y0=null;el.style.transition="";el.style.transform="";if(dy>110)close();});
 }
 drag($("queuePanel"),()=>$("closeQueue").click());
 document.querySelectorAll(".modal").forEach(md=>drag(md,()=>(md.closest(".modal-backdrop")||md.parentNode).classList.remove("show")));
 const si=$("searchInput");si.type="search";si.setAttribute("enterkeyhint","search");si.setAttribute("autocapitalize","off");si.spellcheck=false;
})();
/* ===== Eylem sayfası, Medya Oturumu, durum geri yükleme, sıralama klavye alternatifi ===== */
function confirmSheet(title,destructive) {
 return new Promise(res=>{
  const o=document.createElement("div");o.className="as-back";
  o.innerHTML=`<div class="as-box" role="alertdialog" aria-label="${escapeHTML(title)}"><div class="as-card"><p>${escapeHTML(title)}</p><button class="as-del">${escapeHTML(destructive)}</button></div><div class="as-card"><button class="as-cancel">Vazgeç</button></div></div>`;
  const done=v=>{document.removeEventListener("keydown",key);o.remove();res(v);};
  const key=e=>{if(e.key==="Escape")done(false);};
  o.addEventListener("click",e=>{if(e.target===o)done(false);});
  o.querySelector(".as-del").addEventListener("click",()=>done(true));
  o.querySelector(".as-cancel").addEventListener("click",()=>done(false));
  document.addEventListener("keydown",key);document.body.appendChild(o);o.querySelector(".as-cancel").focus();
 });
}
(function(){
 /* kaydırmadan sıralama: ok tuşları */
 $("page").addEventListener("keydown",e=>{
  const h=e.target.closest&&e.target.closest(".lib-handle");if(!h||!["ArrowUp","ArrowDown"].includes(e.key))return;
  e.preventDefault();const row=h.closest(".lib-row"),list=row.parentNode,up=e.key==="ArrowUp",t=up?row.previousElementSibling:row.nextElementSibling;
  if(!t)return;list.insertBefore(row,up?t:t.nextSibling);h.focus();
  const c=libCfg();c.rows=[...list.children].map(r=>r.dataset.key);libSave(c);
 });
 /* Medya Oturumu: kilit ekranı ve kulaklık kontrolleri */
 if("mediaSession" in navigator){
  const ms=navigator.mediaSession,upd=()=>{const t=state.current;if(!t||!window.MediaMetadata)return;
   ms.metadata=new MediaMetadata({title:t.title,artist:artistOf(t),album:albumOf(t),artwork:t.cover?[{src:t.cover,sizes:"512x512"}]:[]});};
  audio.addEventListener("loadedmetadata",upd);
  audio.addEventListener("play",()=>{upd();ms.playbackState="playing";});
  audio.addEventListener("pause",()=>{ms.playbackState="paused";});
  const set=(a,f)=>{try{ms.setActionHandler(a,f);}catch(e){}};
  set("play",()=>audio.play());set("pause",()=>audio.pause());
  set("previoustrack",()=>$("previousBtn").click());set("nexttrack",()=>$("nextBtn").click());
  set("seekto",e=>{if(e.seekTime!=null)audio.currentTime=e.seekTime;});
 }
 /* kaldığın yerden devam: son sekme/sayfa */
 const SAFE=["songs","albums","artists","playlists","favorites","recent"];
 try{
  const l=JSON.parse(localStorage.getItem("music-last")||"null");
  if(l&&matchMedia("(max-width:760px)").matches&&TAB_ROOTS.includes(l.tab)){
   state.tab=l.tab;state.page=(TAB_ROOTS.includes(l.page)||SAFE.includes(l.page))?l.page:l.tab;state.detail=null;
   if(!TAB_ROOTS.includes(state.page))state.previousPages=[{page:l.tab,detail:null,scroll:0}];
  }
 }catch(e){}
 const save=()=>{if(document.body.classList.contains("lib-edit"))return;try{localStorage.setItem("music-last",JSON.stringify({tab:state.tab,page:state.page}));}catch(e){}};
 document.addEventListener("visibilitychange",()=>{if(document.hidden)save();});
 addEventListener("pagehide",save);
 const mi=$("modalInput");mi.setAttribute("enterkeyhint","done");mi.maxLength=60;mi.autocomplete="off";
})();

/* iOS Safari fallback: block pinch and double-tap zoom gestures, not ordinary scroll. */
(function(){
 const isMobile=()=>matchMedia("(max-width:760px)").matches;
 ["gesturestart","gesturechange","gestureend"].forEach(type=>document.addEventListener(type,e=>{if(isMobile())e.preventDefault();},{passive:false}));
 let lastTouchEnd=0;
 document.addEventListener("touchend",e=>{
  if(!isMobile())return;
  const now=Date.now();
  if(now-lastTouchEnd<=280 && !e.target.closest("input,textarea,select,button,a,[role=button]"))e.preventDefault();
  lastTouchEnd=now;
 },{passive:false});
 document.addEventListener("wheel",e=>{if(isMobile()&&(e.ctrlKey||e.metaKey))e.preventDefault();},{passive:false});
})();

/* ===== Ana Sayfa: doğrudan oynatan kartlar + kapak mozaiği ===== */
var __mos=null;
function trackCard(t) {
 return `<div class="card" tabindex="0" role="button" data-song="${t.id}">${coverHTML(t)}
 <div class="card-title">${escapeHTML(t.title)}</div><div class="card-sub">${escapeHTML(artistOf(t))}</div></div>`;
}
function heroMosaic() {
 const covers=[...new Set(state.tracks.map(t=>t.cover).filter(Boolean))];
 if(!covers.length) return `<div class="hero-mosaic" aria-hidden="true">${"<i></i>".repeat(20)}</div>`;
 if(!__mos||__mos.n!==covers.length){
  const pool=[...covers].sort(()=>Math.random()-.5).slice(0,10),order=[];
  while(order.length<20) [...pool.keys()].sort(()=>Math.random()-.5).forEach(i=>{if(order.length<20)order.push(i);});
  __mos={n:covers.length,pool,order};
 }
 const vars=__mos.pool.map((c,i)=>`--c${i}:url('${c}')`).join(";");
 return `<div class="hero-mosaic" aria-hidden="true" style="${vars}">${__mos.order.map(i=>`<i style="background:var(--c${i}) center/cover"></i>`).join("")}</div>`;
}
/* Yan çubuk, mini oynatıcının gerçek yüksekliğine göre üstte kalır */
(function(){
 const pl=document.querySelector(".player");if(!pl||!window.ResizeObserver)return;
 const set=()=>document.documentElement.style.setProperty("--player-real",pl.offsetHeight+"px");
 new ResizeObserver(set).observe(pl);set();
})();

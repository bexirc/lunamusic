<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Music</title>
<meta name="application-name" content="Music">
<meta name="apple-mobile-web-app-title" content="Music">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="./favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<link rel="manifest" href="./manifest.webmanifest">
<style>
:root {
 --bg:#f5f5f7;
 --panel:#ffffff;
 --text:#191919;
 --muted:#6e6e73;
 --line:rgba(0,0,0,.08);
 --accent:#ff2d55;
 --accent-fill:#ff2d55;
 --hover:rgba(0,0,0,.055);
 --sidebar:rgba(255,255,255,.75);
 --player:rgba(255,255,255,.91);
 --shadow:0 8px 35px rgba(0,0,0,.07);
}
body.dark {
 --bg:#111113;
 --panel:#202023;
 --text:#f5f5f7;
 --muted:#99999f;
 --line:rgba(255,255,255,.09);
 --hover:rgba(255,255,255,.08);
 --sidebar:rgba(28,28,31,.88);
 --player:rgba(32,32,35,.94);
 --shadow:0 8px 35px rgba(0,0,0,.25);
 --accent:#ff375f;
}
*{box-sizing:border-box}
body{
 margin:0;
 background:var(--bg);
 color:var(--text);
 font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",
 "Helvetica Neue",Arial,sans-serif;
 overflow:hidden;
}
button,input{font:inherit}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:3px}
button{min-height:36px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
button{cursor:pointer;color:inherit}
.app{height:100dvh;display:flex;flex-direction:column}
.workspace{flex:1;min-height:0;display:flex;overflow:hidden}
.sidebar{
 width:245px;flex-shrink:0;padding:28px 16px 20px;
 background:var(--sidebar);border-right:1px solid var(--line);
 overflow-y:auto;backdrop-filter:blur(30px);
}
.brand{font-size:25px;font-weight:800;letter-spacing:-1.3px;
 margin:0 12px 32px;display:flex;align-items:center;gap:9px}
.brand-icon{color:var(--accent);font-size:29px}
.nav-title{font-size:11px;color:var(--muted);font-weight:700;
 margin:24px 12px 9px;text-transform:uppercase;letter-spacing:.7px}
.nav-item{
 border:0;background:transparent;width:100%;display:flex;
 align-items:center;gap:13px;text-align:left;padding:11px 13px;
 border-radius:9px;font-size:14px;color:var(--muted);
 transition:.2s;
}
.nav-item:hover{background:var(--hover);color:var(--text)}
.nav-item.active{color:var(--accent);font-weight:650;background:var(--hover)}
.nav-icon{width:20px;text-align:center;font-size:18px}
.sidebar-bottom{margin-top:35px}
.main{flex:1;min-width:0;overflow-y:auto;padding:25px 35px 120px}
.topbar{display:flex;align-items:center;justify-content:space-between;
 gap:15px;margin-bottom:35px}
.top-left{display:flex;gap:9px}
.round-btn{
 width:34px;height:34px;border:0;border-radius:50%;
 background:var(--panel);font-size:18px;box-shadow:0 2px 8px #00000008;
}
.search-wrap{position:relative;max-width:340px;width:100%}
.search{
 width:100%;height:37px;border:1px solid var(--line);
 border-radius:9px;background:var(--panel);padding:0 13px 0 36px;
 color:var(--text);outline:none;font-size:13px;
}
.search-wrap:before{content:none}
.search:focus{border-color:var(--accent)}
.top-actions{display:flex;align-items:center;gap:10px}
.profile{
 width:34px;height:34px;border-radius:50%;background:var(--accent-fill);
 color:white;display:grid;place-items:center;font-weight:700;
}
h1{font-size:31px;letter-spacing:-1px;margin:0 0 7px}
.subtitle{font-size:14px;color:var(--muted);margin-bottom:27px}
.section-head{display:flex;align-items:center;justify-content:space-between;
 margin:32px 0 16px}
.section-head h2{font-size:21px;letter-spacing:-.5px;margin:0}
.text-button{border:0;background:none;color:var(--accent);font-size:13px}
.hero{
 min-height:240px;border-radius:16px;padding:32px;
 display:flex;align-items:flex-end;position:relative;overflow:hidden;
 background:linear-gradient(120deg,#311b55,#9e315c 60%,#f08a83);
 color:white;box-shadow:var(--shadow);
}
.hero:after{
 content:"♫";position:absolute;right:10%;top:-65px;
 font-size:300px;font-weight:800;color:#ffffff18;transform:rotate(12deg);
}
.hero-content{position:relative;z-index:1}
.hero-label{font-size:12px;text-transform:uppercase;letter-spacing:2px;
 opacity:.8;font-weight:700}
.hero h2{font-size:39px;letter-spacing:-1.5px;margin:10px 0}
.hero p{font-size:14px;opacity:.85}
.primary-btn{
 border:0;border-radius:20px;background:white;color:#242424;
 padding:10px 20px;font-weight:650;font-size:13px;
}
.grid{
 display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));
 gap:22px 17px;
}
.card{min-width:0;cursor:pointer}
.cover{
 width:100%;aspect-ratio:1;border-radius:9px;overflow:hidden;
 background:linear-gradient(135deg,#e9a0b0,#573c81);
 display:grid;place-items:center;position:relative;
 box-shadow:0 5px 15px #00000012;
}
.cover img{width:100%;height:100%;object-fit:cover}
.cover-placeholder{font-size:55px;color:#ffffffbd;font-weight:800}
.card-title{font-size:14px;font-weight:650;margin-top:10px;
 overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-sub{font-size:12px;color:var(--muted);margin-top:4px;
 overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.song-list{display:flex;flex-direction:column}
.song{
 display:grid;grid-template-columns:38px minmax(0,1fr) 70px 34px 34px;
 gap:12px;align-items:center;padding:8px 10px;border-radius:8px;
 cursor:pointer;min-height:55px;
}
.song:hover{background:var(--hover)}
.song.active .song-name{color:var(--accent)}
.song-cover{width:38px;height:38px;border-radius:5px;overflow:hidden;
 background:linear-gradient(135deg,#a76caa,#eaa3a3);display:grid;
 place-items:center;color:white;font-size:17px}
.song-cover img{width:100%;height:100%;object-fit:cover}
.song-info{min-width:0}
.song-name{font-size:13px;font-weight:600;white-space:nowrap;
 overflow:hidden;text-overflow:ellipsis}
.song-artist{font-size:12px;color:var(--muted);margin-top:4px;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-duration{font-size:12px;color:var(--muted);text-align:right}
.song-more{border:0;background:transparent;color:var(--muted);font-size:19px;min-width:36px;min-height:36px;border-radius:50%}
.player{
 height:91px;min-height:91px;flex-shrink:0;display:grid;
 grid-template-columns:minmax(180px,1fr) minmax(220px,1.3fr) minmax(150px,1fr);
 align-items:center;padding:0 22px;gap:20px;
 background:var(--player);border-top:1px solid var(--line);
 backdrop-filter:blur(30px);z-index:5;
}
.now-playing{display:flex;align-items:center;gap:12px;min-width:0}
.now-cover{width:55px;height:55px;border-radius:6px;overflow:hidden;
 background:linear-gradient(135deg,#e58caa,#6952a6);display:grid;
 place-items:center;color:white;font-size:22px;flex-shrink:0}
.now-cover img{width:100%;height:100%;object-fit:cover}
.now-info{min-width:0}
.now-title{font-size:13px;font-weight:700;white-space:nowrap;
 overflow:hidden;text-overflow:ellipsis}
.now-artist{font-size:11px;color:var(--muted);margin-top:5px}
.icon-btn{border:0;background:transparent;color:var(--muted);font-size:19px}
.icon-btn:hover{color:var(--accent)}
.controls{display:flex;align-items:center;flex-direction:column;gap:7px}
.control-buttons{display:flex;align-items:center;gap:22px}
.play-btn{
 width:34px;height:34px;border:0;border-radius:50%;
 background:var(--text);color:var(--bg);font-size:16px;
}
.progress-row{width:100%;display:flex;align-items:center;gap:9px;
 font-size:10px;color:var(--muted)}
input[type=range]{accent-color:var(--accent);cursor:pointer}
.progress{width:100%;height:4px}
.player-right{display:flex;justify-content:flex-end;align-items:center;gap:14px}
.volume{width:90px}
.empty{
 padding:55px 20px;text-align:center;color:var(--muted);
 background:var(--panel);border-radius:12px;
}
.empty strong{display:block;color:var(--text);font-size:18px;margin-bottom:8px}
.import-btn{
 border:0;background:var(--accent-fill);color:white;padding:10px 17px;
 border-radius:20px;font-weight:650;font-size:13px;
}
.import-btn:hover{filter:brightness(.94)}
.upload-area{
 position:fixed;inset:18px;z-index:40;border:2px dashed var(--accent);
 border-radius:22px;padding:28px;text-align:center;background:color-mix(in srgb,var(--panel) 94%,transparent);
 display:flex;flex-direction:column;justify-content:center;align-items:center;
 box-shadow:var(--shadow);backdrop-filter:blur(24px);pointer-events:auto;
}
.upload-area strong{font-size:22px}
.upload-area p{font-size:14px;color:var(--muted)}
.upload-area.drag{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--panel))}
.detail-head{display:flex;align-items:flex-end;gap:25px;margin:15px 0 30px}
.detail-cover{width:190px;height:190px;border-radius:12px;overflow:hidden;
 background:linear-gradient(135deg,#e58caa,#6952a6);display:grid;
 place-items:center;color:white;font-size:65px;flex-shrink:0}
.detail-cover img{width:100%;height:100%;object-fit:cover}
.detail-meta{font-size:12px;text-transform:uppercase;color:var(--muted)}
.detail-head h1{margin:9px 0}
.detail-actions{display:flex;gap:10px;margin-top:17px}
.secondary-btn{border:1px solid var(--line);background:var(--panel);
 padding:9px 17px;border-radius:20px;font-size:13px}
.mobile-nav{display:none}
.toast{
 position:fixed;bottom:110px;left:50%;transform:translateX(-50%);
 padding:11px 18px;border-radius:22px;background:var(--text);
 color:var(--bg);font-size:13px;z-index:20;opacity:0;
 pointer-events:none;transition:.25s;
}
.toast.show{opacity:1}
.modal-backdrop{
 position:fixed;inset:0;background:#0008;z-index:30;
 display:none;align-items:center;justify-content:center;padding:20px;
}
.modal-backdrop.show{display:flex}
.modal{width:min(420px,100%);padding:24px;border-radius:16px;
 background:var(--panel);box-shadow:var(--shadow)}
.modal h2{font-size:19px;margin:0 0 18px}
.modal input{width:100%;padding:11px;border:1px solid var(--line);
 background:var(--bg);color:var(--text);border-radius:8px;margin-bottom:12px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px}
.queue-panel{
 position:fixed;right:0;top:0;bottom:91px;width:320px;z-index:10;
 background:var(--panel);border-left:1px solid var(--line);
 padding:22px;transform:translateX(105%);transition:.3s;
 overflow:auto;box-shadow:var(--shadow);
}
.queue-panel.show{transform:translateX(0)}
.queue-head{display:flex;justify-content:space-between;align-items:center}
.queue-head h2{font-size:20px}
.queue-track{display:flex;gap:10px;padding:10px 0;align-items:center;
 cursor:pointer;border-bottom:1px solid var(--line)}
.queue-track img{width:38px;height:38px;object-fit:cover;border-radius:5px}
.queue-track div{min-width:0}
.queue-track strong,.queue-track small{display:block;white-space:nowrap;
 overflow:hidden;text-overflow:ellipsis}
.queue-track strong{font-size:13px}
.queue-track small{font-size:11px;color:var(--muted);margin-top:4px}
.hidden{display:none!important}
@media(max-width:760px){
 .sidebar{display:none}
 .main{padding:calc(17px + env(safe-area-inset-top)) 17px calc(155px + env(safe-area-inset-bottom))}
 .topbar{margin-bottom:25px}
 .top-actions .profile{display:none}
 .player{
 height:75px;position:fixed;bottom:calc(65px + env(safe-area-inset-bottom));left:8px;right:8px;
 border:1px solid var(--line);border-radius:12px;
 grid-template-columns:minmax(0,1fr) auto;padding:7px 11px;gap:8px;
 }
 .now-cover{width:43px;height:43px}
 .controls{gap:0}
 .control-buttons{gap:12px}
 .control-buttons .skip{display:none}
 .progress-row{display:none}
 .player-right{display:none}
 .mobile-nav{
 display:flex;position:fixed;bottom:0;left:0;right:0;height:calc(65px + env(safe-area-inset-bottom));
 padding:0 0 env(safe-area-inset-bottom);
 background:var(--player);backdrop-filter:blur(25px);
 border-top:1px solid var(--line);z-index:8;
 justify-content:space-around;align-items:center;
 }
 .mobile-nav button{border:0;background:none;color:var(--muted);
 display:flex;flex-direction:column;gap:4px;align-items:center;font-size:10px}
 .mobile-nav button span:first-child{font-size:20px}
 .mobile-nav button.active{color:var(--accent)}
 .queue-panel{top:env(safe-area-inset-top);bottom:calc(140px + env(safe-area-inset-bottom));width:min(320px,90vw)}
 .hero{min-height:195px;padding:23px}
 .hero h2{font-size:30px}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 13px}
 .detail-head{align-items:center;flex-direction:column;text-align:center}
 .detail-cover{width:175px;height:175px}
 .detail-actions{justify-content:center}
 .song{grid-template-columns:38px minmax(0,1fr) 40px 30px 30px;gap:8px}
}

/* Apple-inspired refinement: quieter surfaces, clearer states, comfortable controls */
:root{--radius-card:14px;--ease-apple:cubic-bezier(.2,.8,.2,1)}
html{scroll-behavior:smooth}
.nav-item{border-radius:11px;transition:background .18s var(--ease-apple),color .18s var(--ease-apple),transform .18s var(--ease-apple)}
.nav-item:active,.round-btn:active,.icon-btn:active,.play-btn:active,.import-btn:active{transform:scale(.96)}
.nav-item.active{background:color-mix(in srgb,var(--accent) 10%,var(--panel));color:var(--accent)}
.hero{border-radius:20px}
.cover{border-radius:12px;transition:transform .22s var(--ease-apple),box-shadow .22s var(--ease-apple)}
.card:hover .cover{transform:translateY(-2px);box-shadow:0 10px 24px #00000018}
.song{border-radius:11px;transition:background .16s ease}
.song-more:hover{background:var(--hover);color:var(--accent)}
.round-btn,.play-btn,.import-btn,.secondary-btn{transition:transform .16s ease,filter .16s ease,background .16s ease}
.secondary-btn{min-height:40px}
.search{height:40px;border-radius:12px}
.empty{border:1px solid var(--line);border-radius:16px}
.modal{border:1px solid var(--line);border-radius:20px}
.queue-panel{border-radius:18px 0 0 18px}

/* ===== Liquid Glass katmanı: yalnızca gezinme/kontrol yüzeyleri cam; içerik (kart, liste, hero) cam değil ===== */
:root{
 --glass:rgba(255,255,255,.55);--glass-strong:rgba(255,255,255,.76);
 --glass-edge:rgba(255,255,255,.7);
 --glass-shadow:0 12px 40px rgba(0,0,0,.12),0 2px 8px rgba(0,0,0,.06);
 --blur:blur(28px) saturate(180%);
 --r-panel:26px;--gap:12px;--sidebar-w:245px;--player-h:76px;
 --track:rgba(128,128,136,.3)
}
body.dark{
 --glass:rgba(58,58,66,.46);--glass-strong:rgba(36,36,42,.74);--glass-edge:rgba(255,255,255,.18);
 --glass-shadow:0 12px 40px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.3)
}
body{
 background:
  radial-gradient(55vmax 38vmax at 6% -4%,color-mix(in srgb,var(--accent) 15%,transparent),transparent 70%),
  radial-gradient(50vmax 40vmax at 104% 104%,color-mix(in srgb,#5e5ce6 13%,transparent),transparent 70%),
  var(--bg);
 background-attachment:fixed
}
h1{font-size:34px;font-weight:700;letter-spacing:-.8px}
.section-head h2{font-size:22px;font-weight:700;letter-spacing:-.4px}
.ic{display:block;width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic .f{fill:currentColor;stroke:none}
.sidebar,.player,.mobile-nav,.queue-panel,.modal,.upload-area,.round-btn,.search{-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.main,.sidebar,.queue-panel{scrollbar-width:thin}

/* kenar çubuğu: yüzen cam panel */
.workspace{padding-left:calc(var(--sidebar-w) + var(--gap)*2)}
.sidebar{
 position:fixed;left:var(--gap);top:var(--gap);bottom:calc(var(--player-h) + var(--gap)*2);
 width:var(--sidebar-w);z-index:6;padding:24px 12px 16px;border:0;border-radius:var(--r-panel);
 background:var(--glass);
 box-shadow:inset 0 1px 0 var(--glass-edge),inset 0 0 0 .5px var(--glass-edge),var(--glass-shadow)
}
.brand{font-size:22px;font-weight:700;letter-spacing:-.6px;margin:0 12px 24px}
.brand-icon{display:grid;color:var(--accent)}
.brand-icon .ic{width:26px;height:26px}
.nav-item{color:var(--text);font-weight:500;gap:12px;padding:10px 12px;min-height:40px}
.nav-item:hover{background:var(--hover);color:var(--text)}
.nav-item.active{color:var(--text);font-weight:600;background:color-mix(in srgb,var(--accent) 14%,transparent)}
.nav-icon{display:grid;place-items:center;width:22px;height:22px;color:var(--accent)}
.main{padding:24px 32px calc(var(--player-h) + 56px)}

/* üst çubuk */
.top-actions{flex:1;min-width:0;justify-content:flex-end}
.search-wrap{flex:1;min-width:0;max-width:340px}
.search-ico{z-index:1;position:absolute;left:14px;top:50%;transform:translateY(-50%);display:grid;color:var(--muted);pointer-events:none}
.search-ico .ic{width:18px;height:18px}
.search{
 height:40px;border:0;border-radius:999px;padding:0 14px 0 40px;background:var(--glass);
 box-shadow:inset 0 1px 0 var(--glass-edge),inset 0 0 0 .5px var(--glass-edge)
}
.search:focus{box-shadow:inset 0 0 0 1.5px var(--accent)}
.round-btn{
 display:grid;place-items:center;width:40px;height:40px;padding:0;color:var(--text);background:var(--glass);
 box-shadow:inset 0 1px 0 var(--glass-edge),inset 0 0 0 .5px var(--glass-edge),0 2px 10px rgba(0,0,0,.08);
 transition:transform .16s var(--ease-apple),background .16s ease,opacity .16s ease
}
.round-btn:hover{background:var(--glass-strong)}
.round-btn:disabled{opacity:.35;cursor:default;transform:none}
.profile{width:40px;height:40px}

/* içerik */
.hero{border-radius:24px;min-height:260px}
.hero:after{content:"";font-size:0;color:transparent;right:-60px;top:-90px;width:360px;height:360px;border-radius:50%;
 background:radial-gradient(circle at 32% 30%,rgba(255,255,255,.3),rgba(255,255,255,0) 66%);transform:none}
.hero h2{margin:8px 0 6px}
.hero p{margin:0 0 18px}
.primary-btn,.import-btn,.secondary-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 20px;border-radius:999px}
.primary-btn{transition:transform .16s ease,filter .16s ease}
.primary-btn:hover{filter:brightness(.96)}
.primary-btn:active{transform:scale(.96)}
.primary-btn .ic,.import-btn .ic,.secondary-btn .ic{width:16px;height:16px}
.cover-placeholder{display:grid;place-items:center;width:100%;height:100%;font-size:0;color:rgba(255,255,255,.88)}
.cover-placeholder .ic{width:38%;height:38%}
.song-cover,.now-cover,.detail-cover{display:grid;place-items:center;color:rgba(255,255,255,.9)}
.song-cover{border-radius:8px}
.song-cover .ic{width:52%;height:52%}
.now-cover .ic{width:46%;height:46%}
.detail-cover .ic{width:38%;height:38%}
.song{grid-template-columns:38px minmax(0,1fr) 64px 36px 36px;gap:12px}
.song:focus-visible{outline-offset:-2px}
.song-more{display:grid;place-items:center;padding:0;width:36px;height:36px;color:var(--muted);transition:background .16s ease,color .16s ease}
.song-more .ic{width:18px;height:18px}
.song-more.on{color:var(--accent)}
.detail-actions{margin-bottom:8px}
.setting-row{display:flex;justify-content:space-between;align-items:center;gap:16px;cursor:default}
.setting-row:hover{background:transparent}
.settings-group{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:4px 8px}
.settings-group .setting-row+.setting-row{border-top:1px solid var(--line);border-radius:0}

/* oynatıcı: yüzen cam kapsül */
.player{
 position:fixed;left:var(--gap);right:var(--gap);bottom:var(--gap);height:var(--player-h);min-height:var(--player-h);
 padding:0 18px;gap:24px;border:0;border-radius:var(--r-panel);background:var(--glass-strong);z-index:5;
 box-shadow:inset 0 1px 0 var(--glass-edge),inset 0 0 0 .5px var(--glass-edge),var(--glass-shadow)
}
.now-cover{width:52px;height:52px;border-radius:12px}
.now-title{font-size:14px}
.now-artist{font-size:12px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.ios-switch i::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:999px;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:transform .38s var(--ios),width .22s var(--ios)}

.hero-mosaic i:nth-child(10n+7){background:radial-gradient(circle at 30% 70%,#ff006e,transparent 55%),#3a0ca3}

function openDB() {

 const req = indexedDB.open(DB_NAME,1);
 req.onupgradeneeded = () => {
 const db = req.result;
 if (!db.objectStoreNames.contains(STORE))
 db.createObjectStore(STORE,{keyPath:"id"});
 };
 req.onsuccess = () => resolve(req.result);
 req.onerror = () => reject(req.error);
 });
}
async function dbAction(mode,action,data) {
 const db = await openDB();
 return new Promise((resolve,reject) => {
 const tx = db.transaction(STORE,mode);
 tx.oncomplete = () => db.close();
 const store = tx.objectStore(STORE);
 let req;
 if(action==="all") req=store.getAll();
 if(action==="put") req=store.put(data);
 if(action==="delete") req=store.delete(data);
 req.onsuccess=()=>resolve(req.result);
 req.onerror=()=>reject(req.error);
 });
}

async function readMetadata(file) {
 const result={
 title:file.name.replace(/\.[^.]+$/,""),
 artist:"Bilinmeyen Sanatçı",
 album:"Bilinmeyen Albüm",
 cover:null,
 duration:0
 };
 if(!file.name.toLowerCase().endsWith(".mp3")) return result;
 try {
 const buffer=await file.slice(0,Math.min(file.size,8*1024*1024)).arrayBuffer();
 const v=new DataView(buffer);
 if(buffer.byteLength<10 || String.fromCharCode(...new Uint8Array(buffer,0,3))!=="ID3") return result;
 const version=v.getUint8(3);
 const size=(v.getUint8(6)<<21)|(v.getUint8(7)<<14)|(v.getUint8(8)<<7)|v.getUint8(9);
 let pos=10;
 const end=Math.min(10+size,buffer.byteLength);
 const decoder=new TextDecoder("utf-8");
 while(pos+10<end) {
 const id=String.fromCharCode(v.getUint8(pos),v.getUint8(pos+1),v.getUint8(pos+2),v.getUint8(pos+3));
 if(!id.trim() || id.charCodeAt(0)===0) break;
 let len=version===4
 ? ((v.getUint8(pos+4)<<21)|(v.getUint8(pos+5)<<14)|(v.getUint8(pos+6)<<7)|v.getUint8(pos+7))
 : v.getUint32(pos+4);
 if(len<=0 || pos+10+len>end) break;
 const start=pos+10;
 const frame=buffer.slice(start,start+len);
 if(["TIT2","TPE1","TALB"].includes(id)) {
 const bytes=new Uint8Array(frame);
 const enc=bytes[0];
 let value="";
 if(enc===0) value=new TextDecoder("iso-8859-1").decode(bytes.slice(1));
 else if(enc===1) value=new TextDecoder("utf-16").decode(bytes.slice(1));
 else if(enc===2) value=new TextDecoder("utf-16be").decode(bytes.slice(1));
 else value=decoder.decode(bytes.slice(1));
 value=value.replace(/\0/g,"").trim();
 if(id==="TIT2") result.title=value || result.title;
 if(id==="TPE1") result.artist=value || result.artist;
 if(id==="TALB") result.album=value || result.album;
 }
 if(id==="APIC" && !result.cover) {
 try {
 const bytes=new Uint8Array(frame);
 const enc=bytes[0];
 let p=1;
 while(p<bytes.length && bytes[p]!==0) p++;
 const mime=new TextDecoder().decode(bytes.slice(1,p)) || "image/jpeg";
 p+=2;
 if(enc===1 || enc===2) {
 while(p+1<bytes.length && !(bytes[p]===0 && bytes[p+1]===0)) p+=2;
 p+=2;
 } else {
 while(p<bytes.length && bytes[p]!==0) p++;
 p++;
 }
 const blob=new Blob([bytes.slice(p)],{type:mime});
 result.coverBlob=blob;
 } catch(e) {}
 }
 pos+=10+len;
 }
 } catch(e) {}
 return result;
}
async function importFiles(files) {

 if(!list.length) return notify("Desteklenen müzik dosyası bulunamadı.");
 let added=0;
 for(const file of list) {
 const duplicate=state.tracks.some(t=>
 t.name===file.name && t.size===file.size
 );
 if(duplicate) continue;
 const meta=await readMetadata(file);
 const track={
 id:uid(),name:file.name,size:file.size,
 title:meta.title,artist:meta.artist,album:meta.album,
 cover:meta.coverBlob?URL.createObjectURL(meta.coverBlob):null,coverBlob:meta.coverBlob,duration:0,favorite:false,
 added:Date.now(),type:file.type || "audio/mpeg",blob:file
 };
 try {
 await dbAction("readwrite","put",track);
 state.tracks.push(track);
 added++;
 } catch(e) {

 }

}

async function buildTaggedMp3(t) {
 const file=t.blob;
 const head=new Uint8Array(await file.slice(0,10).arrayBuffer());
 let start=0;
 if(head.length>=10 && head[0]===0x49 && head[1]===0x44 && head[2]===0x33) {
 const size=(head[6]<<21)|(head[7]<<14)|(head[8]<<7)|head[9];
 start=10+size+((head[5]&0x10)?10:0);
 }
 const enc=new TextEncoder();
 const frame=(id,data)=>{
 const f=new Uint8Array(10+data.length);
 f.set(enc.encode(id),0);
 new DataView(f.buffer).setUint32(4,data.length);
 f.set(data,10);
 return f;
 };
 const text=(id,str)=>{
 const d=new Uint8Array(3+str.length*2+2);
 d[0]=1;d[1]=0xFF;d[2]=0xFE;
 for(let i=0;i<str.length;i++) {const c=str.charCodeAt(i);d[3+i*2]=c&255;d[4+i*2]=c>>8;}
 return frame(id,d);
 };
 const frames=[];
 if(t.title) frames.push(text("TIT2",t.title));
 if(t.artist && t.artist!==DEFAULT_ARTIST) {frames.push(text("TPE1",t.artist));frames.push(text("TPE2",t.artist));}
 if(t.album && t.album!==DEFAULT_ALBUM) frames.push(text("TALB",t.album));
 if(t.coverBlob) {
 const img=new Uint8Array(await t.coverBlob.arrayBuffer());
 const mime=enc.encode(t.coverBlob.type||"image/jpeg");
 const d=new Uint8Array(1+mime.length+1+1+1+img.length);
 d[0]=0;d.set(mime,1);
 d[1+mime.length]=0;d[2+mime.length]=3;d[3+mime.length]=0;
 d.set(img,4+mime.length);
 frames.push(frame("APIC",d));
 }
 const total=frames.reduce((n,f)=>n+f.length,0);
 const header=new Uint8Array([0x49,0x44,0x33,3,0,0,(total>>21)&127,(total>>14)&127,(total>>7)&127,total&127]);
 return new Blob([header,...frames,file.slice(start)],{type:"audio/mpeg"});
}
async function downloadTrack(t) {
 const isMp3=/\.mp3$/i.test(t.name||"") || t.type==="audio/mpeg";
 let blob=t.blob,name=t.name||"sarki";
 try {
 if(isMp3) {
 blob=await buildTaggedMp3(t);
 const base=[t.artist&&t.artist!==DEFAULT_ARTIST?t.artist:"",t.title].filter(Boolean).join(" - ");
 name=(base.replace(/[\\/:*?"<>|]+/g," ").trim()||"sarki")+".mp3";
 notify("Başlık, sanatçı, albüm ve kapakla indiriliyor.");
 } else notify("Bu biçime etiket gömülemiyor; dosya olduğu gibi indirildi.");
 } catch(e) {notify("Dosya hazırlanamadı.");return;}
 const a=document.createElement("a");
 a.href=URL.createObjectURL(blob);a.download=name;
 document.body.append(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}

document.addEventListener("dragover",e=>{
 if(!Array.from(e.dataTransfer?.types || []).includes("Files")) return;
 e.preventDefault();uploadArea.classList.remove("hidden");uploadArea.classList.add("drag");
});
document.addEventListener("dragleave",e=>{
 if(!e.relatedTarget){uploadArea.classList.add("hidden");uploadArea.classList.remove("drag");}
});
document.addEventListener("drop",e=>{
 if(!Array.from(e.dataTransfer?.types || []).includes("Files")) return;
 e.preventDefault();uploadArea.classList.add("hidden");uploadArea.classList.remove("drag");
 if(e.dataTransfer.files.length) importFiles(e.dataTransfer.files);
});
uploadArea.addEventListener("click",()=>$("fileInput").click());
uploadArea.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();$("fileInput").click();}});
document.addEventListener("keydown",e=>{
 if(e.key==="Escape") {
 $("modal").classList.remove("show");
 $("queuePanel").classList.remove("show");
 closeEdit();
 return;
 }
 if((e.key==="Enter"||e.key===" ") && e.target.matches && e.target.matches(".card,.song:not(.setting-row),.queue-track")) {
 e.preventDefault();e.target.click();
 }
});
$("modal").addEventListener("click",e=>{if(e.target===$("modal")) $("modal").classList.remove("show");});
document.querySelector(".now-playing").addEventListener("click",e=>{
 if(e.target.closest("button")) return;
 if(window.matchMedia("(max-width:760px)").matches) $("queuePanel").classList.add("show");
});
hydrateIcons();
let savedTheme=null;
try {savedTheme=localStorage.getItem("music-theme");} catch(e) {}
themePref=["light","dark","system"].includes(savedTheme)?savedTheme:"system";
applyTheme(resolveDark());
try {
 state.playlists=JSON.parse(localStorage.getItem("music-playlists")||"[]");
} catch(e) {state.playlists=[];}
$("profileBtn").addEventListener("click",()=>navigate(matchMedia("(max-width:760px)").matches?"settings":"profile"));
$("avatarInput").addEventListener("change",e=>{const f=e.target.files[0];e.target.value="";if(f) setAvatar(f);});
$("coverInput").addEventListener("change",async e=>{
 const f=e.target.files[0];e.target.value="";
 if(!f || !editing) return;
 try {
 const blob=await canvasBlob(await squareCanvas(f,800));
 if(editing.newCoverUrl) URL.revokeObjectURL(editing.newCoverUrl);
 editing.newCover=blob;editing.newCoverUrl=URL.createObjectURL(blob);editing.removed=false;
 renderEditCover();
 } catch(err) {notify("Görsel okunamadı.");}
});
$("editCoverChange").addEventListener("click",()=>$("coverInput").click());
$("editCoverRemove").addEventListener("click",()=>{
 if(editing.newCoverUrl) URL.revokeObjectURL(editing.newCoverUrl);
 editing.newCover=null;editing.newCoverUrl=null;editing.removed=true;renderEditCover();
});
$("editCancel").addEventListener("click",closeEdit);
$("editSave").addEventListener("click",saveEdit);
$("editModal").addEventListener("click",e=>{if(e.target===$("editModal")) closeEdit();});
paint($("progress"));paint($("volume"));syncModes();
loadProfile();refreshProfileUI();
loadLibrary();
/* ===== Tam ekran oynatıcı ===== */
(function(){
 const fp=$("fp"),mq=matchMedia("(max-width:760px)");
 [["fpFav","heart"],["fpPrev","prev"],["fpPlay","play"],["fpNext","next"],["fpVolLo","volume"],["fpVolHi","volume"],["fpShuffle","shuffle"],["fpRepeat","repeat"],["fpQueue","list"]].forEach(([i,n])=>$(i).innerHTML=ic(n));
 const open=()=>{if(!state.current)return;syncFull();fp.classList.add("open");fp.setAttribute("aria-hidden","false");$("fpClose").focus({preventScroll:true});};
 window.openFull=open;const close=()=>{fp.classList.remove("open");fp.setAttribute("aria-hidden","true");};
 window.syncFull=function(){
  const t=state.current;if(!t)return;
  if(fp.dataset.tid!==String(t.id)){
   fp.dataset.tid=t.id;
   $("fpTitle").textContent=t.title;$("fpArtist").textContent=artistOf(t);
   $("fpArt").innerHTML=t.cover?`<img src="${t.cover}" alt="">`:ic("note");
   $("fpBg").style.backgroundImage=t.cover?`url("${t.cover}")`:"";
  }
  fp.classList.toggle("playing",!audio.paused);
  setIcon($("fpPlay"),audio.paused?"play":"pause");
  setIcon($("fpFav"),t.favorite?"heartFill":"heart");
  $("fpFav").classList.toggle("on",!!t.favorite);
  syncFullTime();
 };
 window.syncFullTime=function(){
  if(audio.duration){$("fpProgress").value=audio.currentTime/audio.duration*1000;paint($("fpProgress"));}
  $("fpCur").textContent=timeFormat(audio.currentTime);
  $("fpRem").textContent="-"+timeFormat(Math.max(0,(audio.duration||0)-audio.currentTime));
 };
 $("fpClose").addEventListener("click",close);
 $("fpPlay").addEventListener("click",()=>$("playBtn").click());
 $("fpPrev").addEventListener("click",()=>$("previousBtn").click());
 $("fpNext").addEventListener("click",()=>$("nextBtn").click());
 $("fpFav").addEventListener("click",()=>$("favoriteCurrent").click());
 $("fpQueue").addEventListener("click",()=>{close();setTimeout(()=>$("queueBtn").click(),220);});
 $("fpProgress").addEventListener("input",e=>{$("progress").value=e.target.value;$("progress").dispatchEvent(new Event("input"));paint(e.target);});
 $("fpVol").addEventListener("input",e=>{$("volume").value=e.target.value;$("volume").dispatchEvent(new Event("input"));paint(e.target);});
 paint($("fpVol"));paint($("fpProgress"));
 document.querySelector(".now-playing").addEventListener("click",e=>{if(e.target.closest("button")||!mq.matches)return;open();});
 document.addEventListener("keydown",e=>{if(e.key==="Escape"&&fp.classList.contains("open"))close();});
 let y0=null,dy=0;
 $("fpWrap").addEventListener("touchstart",e=>{if(e.target.closest("input"))return;y0=e.touches[0].clientY;dy=0;},{passive:true});
 $("fpWrap").addEventListener("touchmove",e=>{if(y0===null)return;dy=Math.max(0,e.touches[0].clientY-y0);fp.style.transition="none";fp.style.transform=`translateY(${dy}px)`;},{passive:true});
 $("fpWrap").addEventListener("touchend",()=>{if(y0===null)return;y0=null;fp.style.transition="";fp.style.transform="";if(dy>120)close();});
})();
/* ===== Geri dönüş belleği: kenardan kaydırarak geri, sıra panelinden oynatıcıya dönüş ===== */
(function(){
 const mq=matchMedia("(max-width:760px)");
 let sx=null,sy=0;
 document.addEventListener("touchstart",e=>{const t=e.touches[0];sx=t.clientX<24?t.clientX:null;sy=t.clientY;},{passive:true});
 document.addEventListener("touchend",e=>{
  if(sx===null||!mq.matches)return;const t=e.changedTouches[0];
  if(t.clientX-sx>80&&Math.abs(t.clientY-sy)<50&&!$("fp").classList.contains("open")){
   const q=$("queuePanel");if(q.classList.contains("show")){q.classList.remove("show");return;}
   const m=document.querySelector(".modal-backdrop.show");if(m){m.classList.remove("show");return;}
   goBack();
  }
  sx=null;
 },{passive:true});
 $("fpQueue").addEventListener("click",()=>{window.__fromFP=true;});
 $("closeQueue").addEventListener("click",()=>{if(window.__fromFP){window.__fromFP=false;setTimeout(()=>window.openFull&&openFull(),220);}});
})();
</script>
<script>
/* PWA service worker: uygulama kabuğunu çevrimdışı kullanılabilir tutar. */
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js", { scope: "./" }).catch((error) => {
      console.warn("Service worker kaydedilemedi:", error);
    });
  });
}
</script>

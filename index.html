.fpw{position:relative;z-index:1;height:100%;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:4vw;padding:70px 5vw 30px;align-items:center}
.fpl{display:flex;flex-direction:column;align-items:center;gap:18px;max-width:460px;width:100%;margin:0 auto}
.fpc{width:min(100%,46vh);aspect-ratio:1;border-radius:22px;overflow:hidden;background:#ffffff22;display:grid;place-items:center;font-size:5em;box-shadow:0 24px 60px #0006;transition:transform .6s cubic-bezier(.3,.9,.3,1)}.fpc img{width:100%;height:100%;object-fit:cover}
#fp:not(.pn) .fpc{transform:scale(.88)}
.fptt{text-align:center;width:100%;min-width:0}.fptt b,.fptt span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 8px #0004}.fptt b{font-size:1.7em;font-weight:600}.fptt span{opacity:.8}
.fpb{display:flex;gap:10px;align-items:center;width:100%;font-size:.8em;font-variant-numeric:tabular-nums}.fpbar{flex:1;height:6px;border-radius:4px;background:#ffffff40;cursor:pointer;transition:height .25s}.fpbar i{display:block;height:100%;width:0;background:#fff;border-radius:4px;transition:width .28s linear}
.fpk{display:flex;gap:10px;align-items:center;justify-content:center}.fpk button{width:52px;height:52px;padding:0;border-radius:50%;background:none;border:0;color:#fff;box-shadow:none;display:grid;place-items:center}.fpk svg{width:28px;height:28px;pointer-events:none}
.fpk #fa_pp{width:68px;height:68px;background:#fff;color:#222;box-shadow:0 8px 24px #0004}.fpk #fa_pp svg{width:34px;height:34px}
.fpp{height:100%;max-height:calc(100vh - 110px);display:flex;flex-direction:column;background:#00000033;backdrop-filter:blur(18px);border-radius:22px;padding:14px;border:1px solid #ffffff22;min-height:0}
.fpt{display:flex;gap:8px;margin-bottom:10px}.fpt button{flex:1;background:none;border:0;color:#fffb;box-shadow:none;border-radius:14px;padding:7px}.fpt .on{background:#ffffff2e;color:#fff}
.fpq{flex:1;overflow:auto;min-height:0}.fpq small{display:block;opacity:.65;margin:10px 6px 4px;font-size:.75em}
.qi{display:flex;gap:10px;align-items:center;padding:7px 9px;border-radius:12px;cursor:pointer;transition:.2s}.qi.on{background:#ffffff33}
.qi .th{width:40px;height:40px;margin:0;flex:none;color:#fff;background:#ffffff22}.qi div{min-width:0}.qi b,.qi span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.qi b{font-weight:500}.qi span{font-size:.8em;opacity:.75}
.fpq .ly{white-space:pre-wrap;line-height:1.8;font-size:1.15em;font-weight:500;padding:6px}
@media(max-width:820px){.fpw{grid-template-columns:1fr;overflow:auto;align-items:start;padding-top:64px}.fpp{height:340px}}
.logo{margin:2px 0 18px}.logo img{height:2.2em;width:auto;max-width:100%;display:block}

.av{overflow:hidden}.av img{width:100%;height:100%;object-fit:cover;display:block}
.tb{font-size:1em}
.logo img{height:.73em!important}
.fav-large table{font-size:1.15em}.fav-large td{padding:16px 10px}.fav-large .th{width:56px;height:56px;border-radius:8px;margin-right:12px}
.fpop{animation:favPop .45s cubic-bezier(.3,1.6,.5,1)}@keyframes favPop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.acd{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .45s cubic-bezier(.22,1,.36,1),opacity .35s}.acd.open{grid-template-rows:1fr;opacity:1}.acd>div{overflow:hidden;min-height:0}
.acin{padding:12px 6px 4px;font-size:.85em}.acin p{margin:3px 0}
.chv{cursor:pointer}.chv svg{transition:transform .45s cubic-bezier(.3,1.4,.5,1)}.chv.up svg{transform:rotate(180deg)}
.tg{display:flex;gap:10px;align-items:center;margin:8px 0;font-size:.85em;cursor:pointer}.tg input{padding:0;width:16px;height:16px;accent-color:var(--a);box-shadow:none;flex:none}
.pl{box-shadow:0 8px 30px var(--shp,#0002)}

.fplogo{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:2;pointer-events:none}
.fplogo img{height:20px;width:auto;display:block;filter:invert(1) drop-shadow(0 0 8px #ffffffaa) drop-shadow(0 0 22px #ffffff66);animation:fglow 3.5s ease-in-out infinite alternate}
.fplogo::after{content:"";position:absolute;left:8%;right:8%;bottom:-12px;height:10px;background:radial-gradient(ellipse at center,#ffffff80,transparent 70%);filter:blur(6px);animation:fglow 3.5s ease-in-out infinite alternate}
@keyframes fglow{from{opacity:.7}to{opacity:1}}

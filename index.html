<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--p:#f1f1f2;--c:#fff;--t:#111;--m:#777;--l:#e2e2e5;--a:#0a6cff;--h:#0000000d;--fs:15px;--ff:'Red Hat Display',system-ui,sans-serif;color-scheme:light}
:root[data-t=dark]{--bg:#121214;--p:#1d1d20;--c:#1a1a1d;--t:#f2f2f4;--m:#9a9aa2;--l:#2c2c31;--h:#ffffff12;color-scheme:dark}
*{box-sizing:border-box;margin:0}html,body{height:100%}body{font:var(--fw,400) var(--fs)/1.4 var(--ff);background:var(--bg);color:var(--t);overflow:hidden;transition:background .4s,color .4s;padding-top:env(safe-area-inset-top,0px)}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;background:var(--c);border:1px solid var(--l);border-radius:8px;padding:5px 11px;transition:.2s}button:hover{background:var(--h);transform:translateY(-1px)}button:active{transform:scale(.96)}
input,select,textarea{background:var(--c);border:1px solid var(--l);border-radius:8px;padding:6px 10px;outline:0;transition:.2s}input:focus,textarea:focus{border-color:var(--a);box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 25%,transparent)}
.pri{background:var(--a);color:#fff;border-color:var(--a)}.pri:hover{background:var(--a);filter:brightness(1.1)}.dg{color:#e5322d}
#app{display:grid;grid-template-columns:212px 1fr;gap:18px;height:100%;padding:12px}
.sb{background:var(--p);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:8px;overflow:hidden;border:1px solid var(--l)}.sb input{width:100%;font-size:.8em}
.nav{flex:1;overflow:auto;font-size:.85em}.nav a{display:flex;gap:8px;align-items:center;padding:6px 9px;border-radius:7px;cursor:pointer;transition:.25s;white-space:nowrap;overflow:hidden}.nav a:hover{background:var(--h);transform:translateX(3px)}.nav a.on{background:var(--a);color:#fff}
.nav small{display:block;color:var(--m);font-size:.7em;margin:8px 9px 2px}.sub{padding-left:12px;overflow:hidden;transition:max-height .35s,opacity .3s}
.me{background:var(--c);border-radius:10px;padding:6px;display:flex;gap:7px;align-items:center;cursor:pointer;font-size:.75em;border:1px solid var(--l);transition:.25s}.me.on{background:var(--a);color:#fff}.me:hover{transform:scale(1.03)}
.av{width:24px;height:24px;border-radius:50%;background:#ccc;display:grid;place-items:center;color:#555;font-size:.8em;flex:none}
main{overflow:auto;padding:4px 8px 150px;position:relative}#view{transition:opacity .13s,transform .13s}#view.out{opacity:0;transform:translateY(8px)}#view>*{animation:up .45s both;animation-delay:calc(var(--i,0)*40ms)}
@keyframes up{from{opacity:0;transform:translateY(14px)}}@keyframes pop{from{opacity:0;transform:scale(.93)}}
h1{font-weight:500;font-size:1.9em;margin:2px 0 14px}h2{font-weight:500;font-size:1.05em;margin:18px 0 10px}
.tb{display:flex;gap:8px;flex-wrap:wrap;font-size:.8em;margin-bottom:10px}.tb button{border:0;background:none;padding:4px 8px}
table{width:100%;border-collapse:collapse;font-size:.8em}th{text-align:left;font-weight:500;padding:6px;color:var(--m)}td{padding:5px 6px}.r{cursor:default;transition:background .2s;animation:up .4s both;animation-delay:calc(var(--i,0)*18ms)}.r:hover{background:var(--h)}.r.on{background:var(--a);color:#fff}.r.on *{color:#fff!important}.fv,.dl{cursor:pointer;color:var(--a);text-align:center}.fv.o{color:var(--m)}
.th{width:20px;height:20px;border-radius:4px;background:var(--p);object-fit:cover;display:inline-grid;place-items:center;vertical-align:middle;margin-right:6px;font-size:.7em;color:var(--m)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:16px}.card{cursor:pointer;text-align:center;font-size:.85em;transition:.3s;animation:up .45s both;animation-delay:calc(var(--i,0)*40ms);position:relative}.card:hover{transform:translateY(-4px) scale(1.03)}.card:active{transform:scale(.97)}
.cv{aspect-ratio:1;border-radius:16px;background:var(--p);border:1px solid var(--l);display:grid;place-items:center;font-size:2.4em;color:var(--m);overflow:hidden;margin-bottom:6px}.cv img{width:100%;height:100%;object-fit:cover}.card small,.m{color:var(--m)}.pn{position:absolute;right:8px;bottom:34px;font-size:1.2em}
.row{display:flex;gap:10px;overflow:auto;padding-bottom:6px}.row .card{flex:0 0 130px}
.drop{border:1.5px dashed var(--l);background:var(--p);border-radius:16px;padding:60px 20px;text-align:center;transition:.3s;cursor:pointer}.drop:hover,.drop.ov{border-color:var(--a);background:color-mix(in srgb,var(--a) 10%,var(--p));transform:scale(1.01)}.drop b{font-size:1.6em;font-weight:500}
.two{display:grid;grid-template-columns:240px 1fr;gap:16px}.al{max-height:70vh;overflow:auto}.al div{display:flex;gap:10px;align-items:center;padding:6px 10px;border-radius:8px;cursor:pointer;transition:.25s}.al div:hover{background:var(--h)}.al div.on{background:var(--a);color:#fff}.al .av{width:34px;height:34px}
.box{background:var(--c);border:1px solid var(--l);border-radius:14px;padding:14px;max-width:560px;margin:0 auto 14px}.tabs{display:flex;gap:8px;margin-top:10px}.tabs button{flex:1}.tabs .on{background:var(--a);color:#fff}
.sw{display:flex;gap:12px;flex-wrap:wrap;margin:8px 0}.sw i{width:30px;height:30px;border-radius:50%;cursor:pointer;transition:.25s;border:3px solid transparent}.sw i:hover{transform:scale(1.2)}.sw i.on{border-color:var(--t)}
.seg{display:flex;gap:8px}.seg button{flex:1;border-radius:20px}.seg .on{background:var(--a);color:#fff}.fr{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}.fr button{flex:1}
.pl{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(430px,94vw);background:color-mix(in srgb,var(--c) 85%,transparent);backdrop-filter:blur(18px);border:1px solid var(--l);border-radius:18px;padding:8px 12px;display:flex;align-items:center;gap:10px;z-index:20;box-shadow:0 8px 30px #0002;transition:.3s}.pl button{border:0;background:none;padding:4px 6px;font-size:1.05em}
.pi{display:flex;gap:8px;align-items:center;flex:1;min-width:0;font-size:.75em}.pi .th{width:34px;height:34px;margin:0;flex:none}.pi div{min-width:0;flex:1}.pi b,.pi span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar{height:4px;background:var(--l);border-radius:3px;margin-top:4px;cursor:pointer}.bar i{display:block;height:100%;width:0;background:var(--a);border-radius:3px}
.mn{position:fixed;z-index:60;background:color-mix(in srgb,var(--c) 92%,transparent);backdrop-filter:blur(16px);border:1px solid var(--l);border-radius:12px;padding:5px;min-width:190px;max-height:60vh;overflow:auto;box-shadow:0 10px 36px #0003;animation:pop .18s both;transform-origin:top left;font-size:.85em}.mn.out{opacity:0;transform:scale(.95);transition:.15s}.mn div{padding:7px 11px;border-radius:7px;cursor:pointer;transition:.15s}.mn div:hover{background:var(--a);color:#fff}.mn hr{border:0;border-top:1px solid var(--l);margin:4px 0}
.ov{position:fixed;inset:0;background:#0005;backdrop-filter:blur(4px);display:grid;place-items:center;z-index:80;animation:fi .25s}.ov.out{opacity:0;transition:.2s}@keyframes fi{from{opacity:0}}.md{background:var(--c);border:1px solid var(--l);border-radius:16px;padding:18px;width:min(400px,92vw);animation:pop .3s cubic-bezier(.2,1.2,.4,1)}.md label{display:block;font-size:.75em;color:var(--m);margin:8px 0 2px}.md input{width:100%}
.um{position:fixed;right:20px;bottom:90px;width:340px;max-width:92vw;background:var(--c);border:1px solid var(--l);border-radius:14px;padding:10px;z-index:30;animation:pop .3s both;font-size:.75em;box-shadow:0 8px 30px #0002}.um .ls{overflow:hidden;transition:max-height .35s}.pg{height:5px;background:var(--l);border-radius:3px;overflow:hidden}.pg i{display:block;height:100%;background:var(--a);transition:width .15s}
.it{display:grid;grid-template-columns:24px 1fr;gap:8px;margin:6px 0;color:var(--a)}.it div{color:var(--t)}.it span{display:flex;justify-content:space-between;color:var(--m)}
#toast{position:fixed;top:18px;left:50%;transform:translate(-50%,-80px);background:var(--t);color:var(--bg);padding:8px 16px;border-radius:20px;transition:.4s;z-index:99;font-size:.85em}#toast.s{transform:translate(-50%,0)}
.emp{color:var(--m);padding:30px;text-align:center;border:1px dashed var(--l);border-radius:14px}
@media(max-width:720px){#app{grid-template-columns:54px 1fr}.nav a span,.nav small,.me span,.sb input{display:none}.two{grid-template-columns:1fr}.um{bottom:84px}}
.sb{border-radius:16px}.nav{font-size:.78em}.nav a{padding:5px 8px}

.sw i{position:relative}.rmc{position:absolute;top:-7px;right:-7px;width:16px;height:16px;border-radius:50%;background:var(--t);color:var(--bg);font-size:11px;font-style:normal;display:none;place-items:center;line-height:1}.sw i:hover .rmc{display:grid}
.addc{width:30px;height:30px;border-radius:50%;border:2px dashed var(--m);display:grid;place-items:center;cursor:pointer;position:relative;color:var(--m);font-size:1.1em}.addc input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;padding:0}
.bgc{display:flex;gap:10px;align-items:center;margin:8px 0}.bgc input[type=color]{width:46px;height:34px;padding:2px;border-radius:8px;cursor:pointer}

html.glass :is(.box,.md) button:not(.on):not(.pri),html.glass :is(.box,.md,.tb) select,html.glass :is(.box,.md) textarea,html.glass :is(.box,.md) input:not([type=color]):not([type=range]):not([type=checkbox]){background:color-mix(in srgb,var(--c) 45%,transparent)}
html.glass .ov:not(.drop){background:#0000004d;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
html.glass tbody tr:hover{background:#ffffff1a}

.bgo{width:30px;height:30px;border-radius:50%;cursor:pointer;border:3px solid transparent;display:grid;place-items:center;font-size:.85em;font-style:normal;background:var(--p);position:relative;transition:.25s;box-shadow:inset 0 0 0 1px var(--l);color:var(--m)}.bgo.on{border-color:var(--t)}.bgo:hover{transform:scale(1.2)}.bgo input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;padding:0}
.fpk #fa_pp{background:none;color:#fff;box-shadow:none;width:72px;height:72px}.fpk #fa_pp:hover{background:none;transform:scale(1.12)}.fpk #fa_pp svg{width:46px;height:46px}
.qi .th{display:grid;place-items:center;font-size:1em;opacity:1;overflow:hidden;white-space:normal}#ql a .th{display:inline-grid;place-items:center}
.jl{font-style:normal;cursor:pointer;transition:color .2s}.jl:hover{color:var(--a);text-decoration:underline}#fp .jl:hover{color:#fff}#pa:hover{color:var(--m)!important}
#fptt{cursor:pointer}#fptt:hover{text-decoration:underline}
.card.song-pulse .cv{box-shadow:0 0 0 3px var(--a),0 8px 20px #0003}

html.hasbg table{background:color-mix(in srgb,var(--c) 34%,transparent);border-radius:12px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}

html.hasbg tbody tr.on,html.hasbg tbody tr.r.on{background:var(--a)}

html.hasbg .emp,html.hasbg .card .cv{border-color:var(--l)}
table{background:color-mix(in srgb,var(--t) 4.5%,transparent);border-radius:14px;padding:6px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}

.eimg{display:flex;align-items:center;gap:12px;margin:4px 0}.eprev{width:64px;height:64px;border-radius:12px;overflow:hidden;display:grid;place-items:center;flex:none;background:var(--p);box-shadow:var(--sh)}.eprev img{width:100%;height:100%;object-fit:cover}.eprev .nt{width:55%;height:55%;opacity:.5}.eacts{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
#fp .qi .th.ph{background:#ffffff22!important;color:#fff!important;box-shadow:none}
.cv[data-cid]{box-shadow:inset 0 0 0 1px var(--l),0 6px 16px var(--cs,#0000001a)}.th[data-cid]{box-shadow:0 2px 6px var(--cs,#0002)}.card:hover .cv[data-cid]{box-shadow:inset 0 0 0 1px var(--l),0 10px 22px var(--cs,#00000026)}#fpcv[data-cid]{box-shadow:0 24px 60px var(--cs,#0006)}
.r .th{width:28px;height:28px;min-width:28px;flex:none;box-sizing:border-box;border-radius:6px;vertical-align:middle;object-fit:cover}.fav-large .r .th{width:48px;height:48px;min-width:48px}
.md.wide{overflow:hidden;display:flex;flex-direction:column}.md.wide .mel{overflow:auto;min-height:0;flex:1;padding:2px 4px 2px 2px;margin:0 -4px 0 -2px}.md.wide .fr{position:static;background:none;box-shadow:none;padding:12px 0 0;margin:0}

#mtab,#splash,#intro{display:none}
html.mob #mtab{display:flex}
html.mob .sb,html.mob #qw{display:none!important}
html.mob #app{display:block;padding:0;height:100%}
html.mob main{height:100%;padding:6px 16px calc(176px + env(safe-area-inset-bottom,0px));overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
html.mob #view>*{animation-name:mfade!important}@keyframes mfade{from{opacity:0}to{opacity:1}}
#mtab{position:fixed;left:14px;right:14px;bottom:calc(max(env(safe-area-inset-bottom,0px),8px) + 4px);height:58px;border-radius:32px;background:color-mix(in srgb,var(--c) 88%,transparent);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);box-shadow:0 8px 28px #0002,0 0 0 1px var(--l);z-index:50;padding:6px}
#mtab .mind{position:absolute;left:6px;top:6px;bottom:6px;width:calc((100% - 12px)/5);border-radius:26px;background:var(--a);box-shadow:0 6px 16px color-mix(in srgb,var(--a) 50%,transparent);transition:transform .5s cubic-bezier(.3,1.4,.5,1),opacity .3s;transform:translateX(calc(var(--i,0)*100%))}
#mtab.noact .mind{opacity:0}
#mtab button{flex:1;position:relative;z-index:1;background:none!important;border:0;box-shadow:none;color:var(--m);display:grid;place-items:center;border-radius:26px;padding:0;transition:color .3s,transform .3s}
#mtab button svg,#mtab button .nt{width:24px;height:24px}#mtab button.on{color:#fff;transform:scale(1.08)}
html.mob body .pl{left:14px;right:14px;width:auto;transform:none;bottom:calc(max(env(safe-area-inset-bottom,0px),8px) + 70px);border-radius:22px;padding:8px 10px 6px;z-index:45;touch-action:pan-y}
html.mob .pl :is(#pv,#nx,#rp,#pf,#qu,#mo){display:none}html.mob .pl .bw{padding:0 4px}html.mob .pl .bw span{display:none}
html.mob #toast{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
html.mob #mgs{bottom:calc(150px + env(safe-area-inset-bottom,0px));left:12px;right:12px;width:auto}
.mh{display:flex;align-items:center;gap:10px;margin:6px 0 12px}.mh .mtt{flex:1;margin:0;font-size:1.55em;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mb{width:38px;height:38px;border-radius:50%;padding:0;display:grid;place-items:center;flex:none}
.mpill{display:flex;border-radius:22px;background:var(--p);box-shadow:var(--sh),0 0 0 1px var(--l);overflow:hidden;flex:none}.mpill button{border:0;background:none;box-shadow:none;padding:9px 14px;border-radius:0;display:grid;place-items:center}.mpill button+button{border-left:1px solid var(--l)}
.mhh .logo{margin:0;flex:1}.mav{width:40px;height:40px;border-radius:50%;padding:0;overflow:hidden;display:grid;place-items:center;flex:none}.mav img{width:100%;height:100%;object-fit:cover}
.msb input{width:100%;border-radius:22px;padding:11px 18px;background:var(--p)}
.mbtn{display:flex;gap:10px;justify-content:center;margin:12px 0}.mbtn button{border-radius:22px;padding:8px 22px;display:inline-flex;gap:6px;align-items:center}.mbtn svg{width:16px;height:16px}
html.mob .tb{display:none}

.mlist{display:flex;flex-direction:column}
.mr{display:flex;align-items:center;gap:12px;padding:8px 4px;border-radius:12px;cursor:pointer}

.mt2{flex:1;min-width:0}.mt2 b,.mt2 span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mt2 b{font-weight:500}.mt2 span{font-size:.8em;color:var(--m)}
.mr.on{background:color-mix(in srgb,var(--a) 18%,transparent)}.mr.playing .mt2 b{color:var(--a)}
.mmore{width:34px;height:34px;border:0;background:none;box-shadow:none;padding:0;color:var(--m);display:grid;place-items:center}.mmore svg{width:18px;height:18px}
.mr .fv{color:var(--a);font-size:.9em}.mr .dl{color:var(--m);width:22px;height:22px;border:1.5px solid var(--l);border-radius:50%;display:grid;place-items:center;font-size:.7em;flex:none}
.ml{font-weight:600;margin:16px 0 6px;font-size:.9em;color:var(--m)}
